services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webbuilder}
      POSTGRES_DB: ${POSTGRES_DB:-webbuilder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webbuilder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-webbuilder}:${POSTGRES_PASSWORD:-webbuilder}@postgres:5432/${POSTGRES_DB:-webbuilder}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@example.com}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-dev-caddy-secret}
      PUBLIC_APP_HOST: ${PUBLIC_APP_HOST:-app.localhost}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-api.localhost}
      RENDERER_DEFAULT_HOST: ${RENDERER_DEFAULT_HOST:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://app.localhost}
      # --- Storage --- pick one driver: local | s3
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      # s3 (works for MinIO + AWS S3)
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-minio:9000}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-assets}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-http://localhost:9000/assets}
      # local
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_LOCAL_PUBLIC_URL: ${STORAGE_LOCAL_PUBLIC_URL:-http://api.localhost/uploads}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://api.localhost}
      NODE_ENV: production
    ports:
      - "3000:3000"

  renderer:
    build:
      context: ../apps/renderer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "3001:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - renderer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-dev-caddy-secret}

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  caddydata:
  caddyconfig:
