services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webbuilder}
      POSTGRES_DB: ${POSTGRES_DB:-webbuilder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webbuilder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-webbuilder}:${POSTGRES_PASSWORD:-webbuilder}@postgres:5432/${POSTGRES_DB:-webbuilder}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-dev-caddy-secret}
      PUBLIC_APP_HOST: ${PUBLIC_APP_HOST:-app.localhost}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-api.localhost}
      RENDERER_DEFAULT_HOST: ${RENDERER_DEFAULT_HOST:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://app.localhost}
    ports:
      - "8080:8080"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://api.localhost}
      NODE_ENV: production
    ports:
      - "3000:3000"

  renderer:
    build:
      context: ../apps/renderer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "3001:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - renderer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-dev-caddy-secret}

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
