# Snippet Docker Compose untuk deploy api-registry bareng web builder.
# Paste ke `infra/docker-compose.yml` di section services, atur network
# supaya web-builder API bisa reach api-registry lewat DNS internal.
#
# Usage:
#   1. Copy .env.example → .env, isi PANDI_* credentials
#   2. Set INTERNAL_HMAC_SECRET (min 32 char) — SAMA di web-builder API sisi
#      supaya signing verify.
#   3. docker compose up -d api-registry
#   4. Verify: curl http://localhost:5000/healthz

services:
  api-registry:
    build:
      context: ../apps/api-registry
      dockerfile: Dockerfile
    image: webbuilder/api-registry:latest
    container_name: api-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # HTTP
      PORT: "5000"
      APP_ENV: "${APP_ENV:-dev}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      # Provider mode: pandi_wrapper (Fase 1) atau epp_direct (Fase 2)
      PROVIDER_MODE: "${API_REGISTRY_PROVIDER_MODE:-pandi_wrapper}"

      # PANDI wrapper (Fase 1)
      PANDI_API_URL: "${PANDI_API_URL}"
      PANDI_API_KEY: "${PANDI_API_KEY:-}"
      PANDI_EMAIL: "${PANDI_EMAIL:-}"
      PANDI_PASSWORD: "${PANDI_PASSWORD:-}"
      PANDI_API_TIMEOUT: "${PANDI_API_TIMEOUT:-15s}"

      # EPP direct (Fase 2 — kosong dulu)
      # EPP_HOST: ${EPP_HOST}
      # EPP_PORT: ${EPP_PORT:-700}
      # EPP_USER: ${EPP_USER}
      # EPP_PASSWORD: ${EPP_PASSWORD}
      # EPP_CERT_FILE: /etc/api-registry/epp-client.crt
      # EPP_KEY_FILE:  /etc/api-registry/epp-client.key
      # EPP_CA_FILE:   /etc/api-registry/pandi-ca.crt

      # Internal auth (SAMA dengan web-builder API sisi)
      INTERNAL_HMAC_SECRET: "${INTERNAL_HMAC_SECRET}"

      # Runtime
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-30s}"
      MAX_CONCURRENT: "${MAX_CONCURRENT:-20}"
    # volumes:
    #   # Untuk EPP direct (Fase 2) — mount TLS cert dari host
    #   - ./certs:/etc/api-registry:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - webbuilder_internal

networks:
  webbuilder_internal:
    external: true  # atau bikin sendiri kalau standalone
