# TEMPLATE — JANGAN commit ke git dengan value asli!
#
# Setup:
#   1. Copy file ini ke `20-secret.local.yaml` (di-gitignore)
#   2. Isi value base64-encoded:
#        echo -n 'raw-value' | base64
#   3. kubectl apply -f 20-secret.local.yaml
#
# Alternatively: gunakan sealed-secrets, external-secrets, atau
# Vault/AWS Secrets Manager untuk production. Plain Secret hanya OK untuk
# staging / demo.
apiVersion: v1
kind: Secret
metadata:
  name: api-registry-secrets
  namespace: webbuilder
  labels:
    app.kubernetes.io/name: api-registry
type: Opaque
stringData:
  # Credentials PANDI (Fase 1 wrapper mode). Cukup salah satu:
  #   - PANDI_API_KEY (JWT statis, rotate manual 30 hari)
  #   - PANDI_EMAIL + PANDI_PASSWORD (auto-refresh setiap 25 hari)
  PANDI_API_KEY: ""
  PANDI_EMAIL: "reseller@customer-registrar.id"
  PANDI_PASSWORD: "REPLACE_ME"

  # HMAC secret — SAMA dengan `API_REGISTRY_HMAC_SECRET` di web builder API.
  # Generate: openssl rand -hex 32
  INTERNAL_HMAC_SECRET: "REPLACE_ME_32_CHAR_HEX"

  # Webhook secrets.
  # Upstream: verify webhook dari registrar-api PANDI. Nilai sama dengan
  # yang di-rotate di /admin/registrar dashboard.
  WEBHOOK_UPSTREAM_SECRET: "REPLACE_ME"
  # Forward: sign webhook ke web builder API. SAMA dengan INTERNAL_HMAC_SECRET
  # supaya web builder verify pakai code path yang sama.
  WEBBUILDER_WEBHOOK_SECRET: "REPLACE_ME_SAME_AS_INTERNAL_HMAC_SECRET"

  # EPP direct credentials (Fase 2 — kosong dulu). Kalau nanti aktif, mount
  # cert file via Secret volume (bukan stringData).
  # EPP_HOST: "epp1.pandi.id"
  # EPP_USER: ""
  # EPP_PASSWORD: ""
