# HorizontalPodAutoscaler — scale berdasarkan CPU + memory. Sesuaikan
# angka setelah observasi actual traffic.
#
# CATATAN: job store in-memory belum shared antar pod (Fase 1a). Auto-scale
# > 2 replica bikin job cuma visible di pod tertentu — audit trail bocor
# antara replica. Untuk MVP: cap maxReplicas: 2 sampai Fase 2 (Redis-backed
# store).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-registry
  namespace: webbuilder
  labels:
    app.kubernetes.io/name: api-registry
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-registry
  minReplicas: 2
  maxReplicas: 2   # Fase 2 (Redis jobs) bisa naikkan ke 5-10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 menit — cegah flapping
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
