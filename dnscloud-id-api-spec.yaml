openapi: 3.1.0
info:
  title: DNSCloud.ID API
  version: '1.0.0'
  summary: Managed DNS & DNSSEC untuk Indonesia
  description: |
    REST API DNSCloud.ID. **Panel web memakai API yang sama persis** —
    tidak ada endpoint khusus panel (FR-8.2). Bila panel dapat melakukan
    sesuatu, Anda juga dapat melakukannya lewat API ini.

    ## Autentikasi

    Dua cara, dan keduanya setara kecuali pada satu hal:

    | Cara | Dipakai untuk | Catatan |
    |---|---|---|
    | `Authorization: Bearer dcid_…` | otomasi, CI/CD, skrip | dibatasi *scope*, opsional dibatasi ke zona tertentu |
    | Cookie sesi | panel web | izin penuh atas organisasi |

    Token API **tidak dapat membuat token API**. Bila bisa, satu token
    yang bocor dapat memperluas dirinya sendiri menjadi akses permanen,
    dan mencabut token asal tidak lagi menutup aksesnya.

    ### Dua host, dan mana yang menerima apa

    | Host | Menerima | Tidak menerima |
    |---|---|---|
    | `api.dnscloud.id` | token Bearer | cookie sesi |
    | panel (mis. `dnscloud.id`) | keduanya | — |

    Cookie sesi memakai awalan `__Host-`, yang mengunci cookie ke satu
    host dan melarang atribut `Domain`. Peramban karena itu tidak akan
    pernah mengirim sesi panel ke `api.dnscloud.id` — sifat token-only
    host itu dijamin oleh cara cookie bekerja, bukan oleh pemeriksaan
    yang bisa lupa ditulis.

    `api.dnscloud.id` juga tidak menyajikan `/healthz`, `/readyz`, atau
    `/metrics`. Host itu adalah kontrak publik; endpoint operasional
    tidak pernah menjadi bagiannya.

    ### API ini untuk dipanggil dari SERVER, bukan dari peramban

    CORS hanya mengizinkan asal panel, jadi JavaScript di peramban pada
    situs lain tidak dapat memanggil API ini. Itu disengaja: token
    ber-scope `zones:write` yang ditanam di JavaScript peramban terbaca
    setiap pengunjung situs itu — dan siapa pun yang membacanya dapat
    menghapus seluruh record DNS organisasi Anda.

    Klien dari server (curl, Go, Python, runner CI) tidak terpengaruh
    sama sekali: CORS adalah mekanisme peramban. Untuk aplikasi berbasis
    peramban, panggil API ini dari backend Anda sendiri dan jangan pernah
    mengirim token ke sisi klien.

    ## Error

    Seluruh error memakai `application/problem+json` (RFC 9457) dengan
    field `code` yang **stabil** — ia bagian dari kontrak publik, jadi
    aman dijadikan dasar logika program. `detail` ditulis untuk dibaca
    manusia dan boleh berubah.

    ## Rate limit

    Default 1.200 permintaan per 5 menit per token. Respons membawa
    header `RateLimit-*`; saat terlampaui, `429` beserta `Retry-After`.
  contact:
    name: DNSCloud.ID
    email: support@dnscloud.id
  license:
    name: Proprietary

servers:
  - url: https://api.dnscloud.id/v1
    description: Produksi
  - url: http://localhost:8080/v1
    description: Pengembangan lokal

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - name: Autentikasi
  - name: Organisasi
  - name: Zona
  - name: Record
  # Berbagi akses satu domain kepada orang di luar akun.
  - name: Domain
  - name: DNSSEC
  - name: Token
  - name: Paket
  - name: Load Balancer
  - name: OAuth
  - name: Operator

paths:
  /auth/register:
    post:
      tags: [Autentikasi]
      summary: Daftar akun baru
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                name: { type: string }
      responses:
        '201': { description: Akun dibuat, sesi dimulai }
        '409':
          description: |
            Email sudah terdaftar. Pesan sengaja tidak membedakan kasus ini
            dari keberhasilan, agar endpoint ini tidak menjadi alat
            pencacahan akun.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validasi' }
        '429':
          description: |
            Terlalu banyak percobaan dari alamat ini (20 per 5 menit).

            Pembatas terpisah dari pembatas umum, karena setiap
            pendaftaran menjalankan Argon2id 19 MiB — laju yang wajar bagi
            API record adalah laju penghabisan sumber daya di sini.

  /auth/login:
    post:
      tags: [Autentikasi]
      summary: Masuk dengan email & password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Sesi dimulai }
        '401': { description: Email atau password salah }
        '429': { description: Terlalu banyak percobaan — akun dikunci sementara }

  /auth/logout:
    post:
      tags: [Autentikasi]
      summary: Keluar
      responses: { '204': { description: Sesi dicabut } }

  /auth/password/forgot:
    post:
      tags: [Autentikasi]
      summary: Minta tautan atur ulang password
      description: |
        Mengirim tautan pemulihan ke alamat email yang diberikan.

        Responsnya **selalu 202 dengan isi yang sama**, terdaftar atau
        tidak. Endpoint ini tidak memerlukan autentikasi, sehingga
        membedakan jawabannya akan menjadikannya alat pencacah pelanggan
        yang gratis dan tak terbatas.

        Dibatasi per alamat email, bukan per IP: sasaran gangguannya adalah
        kotak masuk itu, dan mengganti IP tidak boleh mengubah apa pun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202':
          description: Diterima — dikirim bila email terdaftar
          content:
            application/json:
              schema:
                type: object
                properties: { pesan: { type: string } }

  /auth/password/reset:
    post:
      tags: [Autentikasi]
      summary: Atur ulang password dengan token
      description: |
        Menukar token sekali pakai dari email menjadi password baru.

        Seluruh sesi pengguna dicabut. Jalur ini dipakai justru ketika akun
        diduga dikuasai orang lain; membiarkan sesi lama hidup akan membuat
        pemulihan tidak memulihkan apa pun.

        Sesi baru **tidak** dibuat otomatis — pengguna harus masuk, sehingga
        password barunya ikut terbukti.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties: { pesan: { type: string } }
        '410': { description: Tautan sudah dipakai atau kedaluwarsa }
        '422': { $ref: '#/components/responses/Validasi' }

  /auth/password:
    post:
      tags: [Autentikasi]
      summary: Ganti password dari sesi yang sedang berjalan
      description: |
        Mengganti password sendiri. Seluruh sesi LAIN dicabut; sesi yang
        dipakai mengganti tetap hidup.

        Akun yang lahir dari SSO belum punya password sama sekali —
        `password_lama` boleh dikosongkan untuk memasangnya pertama kali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_baru]
              properties:
                password_lama: { type: string }
                password_baru: { type: string, minLength: 10 }
      responses:
        '204': { description: Password diperbarui }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validasi' }

  /auth/email/verify:
    post:
      tags: [Autentikasi]
      summary: Konfirmasi alamat email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties: { pesan: { type: string } }
        '410': { description: Tautan sudah dipakai atau kedaluwarsa }

  /auth/email/resend:
    post:
      tags: [Autentikasi]
      summary: Kirim ulang tautan verifikasi email
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                properties: { pesan: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Terlalu sering }

  /auth/me:
    get:
      tags: [Autentikasi]
      summary: Identitas pemanggil
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/providers:
    get:
      tags: [Autentikasi]
      summary: Penyedia SSO yang aktif
      description: |
        Dipakai panel untuk menentukan tombol mana yang ditampilkan.
        Penyedia tanpa kredensial tidak muncul di sini dan endpoint-nya
        menolak — SSO adalah kemudahan, bukan prasyarat.
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: [array, 'null']
                    items: { type: string, enum: [eid, google] }

  /auth/sso/{provider}/start:
    get:
      tags: [Autentikasi]
      summary: Mulai alur SSO
      description: |
        Dipakai untuk dua alur yang berbeda.

        Tanpa `maksud`, ini alur MASUK: identitas penyedia diselesaikan
        menurut aturan penautan ADR-004.

        Dengan `maksud=tautkan` dan sesi panel yang aktif, ini alur
        MENAUTKAN penyedia ke akun yang sedang masuk. Callback melewati
        aturan ADR-004 sepenuhnya — pertanyaan "identitas ini milik siapa"
        sudah terjawab oleh sesi — dan menolak bila identitas penyedia
        tersebut sudah tertaut ke pengguna lain.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [eid, google] } }
        - name: maksud
          in: query
          required: false
          schema: { type: string, enum: [tautkan] }
          description: Diabaikan bila tidak ada sesi panel yang aktif.
      responses: { '302': { description: Pengalihan ke penyedia } }

  /auth/sso/{provider}/callback:
    get:
      tags: [Autentikasi]
      summary: Selesaikan alur SSO
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses: { '302': { description: Pengalihan kembali ke panel } }

  /auth/identities:
    get:
      tags: [Autentikasi]
      summary: Metode masuk yang tertaut
      responses: { '200': { description: Daftar identitas } }

  /auth/identities/tertunda:
    get:
      tags: [Autentikasi]
      summary: Identitas yang menunggu konfirmasi penautan
      description: |
        Dipakai panel untuk MENYEBUTKAN identitas yang akan ditempelkan
        sebelum penautan diselesaikan.

        Jalur ini hanya terpakai pada penyedia yang tidak memantulkan
        parameter `state` — e.id salah satunya. Tanpa `state`, callback
        hanyalah GET tingkat atas yang membawa cookie, dan itu cukup untuk
        dibajak: penyerang menggiring korban ke `/start?maksud=tautkan`
        lalu ke `/callback?code=<kode penyerang>`, dan identitasnya
        menempel permanen pada akun korban.

        Yang memutus rantai itu adalah perubahan metode — konfirmasinya
        POST, dan cookie SameSite tidak ikut pada POST lintas-situs —
        ditambah layar yang menyebutkan identitasnya, sehingga korban yang
        alurnya dibajak membaca email yang bukan miliknya lalu menolak.

        `tertunda` bernilai null bila tidak ada yang menunggu, konfirmasinya
        sudah kedaluwarsa (lima menit), atau ia milik akun lain.
      responses:
        '200': { description: 'Objek `{tertunda}`; null bila tidak ada' }
        '401': { description: Belum masuk }

  /auth/identities/konfirmasi:
    post:
      tags: [Autentikasi]
      summary: Selesaikan penautan yang menunggu konfirmasi
      description: |
        Menuntut sesi yang SAMA dengan yang memulai alurnya, dan menolak
        sesi yang belum melewati 2FA — menambah metode masuk mengubah
        keamanan akun, jadi ia diperlakukan seperti perubahan keamanan
        lainnya.

        Konfirmasinya sekali pakai: cookie-nya dihapus sebelum hasilnya
        ditulis, berhasil maupun gagal.
      responses:
        '200': { description: 'Tertaut; memuat `provider` dan `email`' }
        '400': { description: Konfirmasi kedaluwarsa atau tidak ada }
        '401': { description: Belum masuk, atau sesi berubah di tengah alur }
        '403': { description: 2FA belum diselesaikan, atau konfirmasi milik akun lain }
        '409': { description: Identitas itu sudah tertaut ke akun lain }

  /auth/identities/{id}:
    delete:
      tags: [Autentikasi]
      summary: Lepas satu metode masuk
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Dilepas }
        '409':
          description: |
            `LAST_LOGIN_METHOD` — ini satu-satunya cara pengguna masuk.
            Melepasnya akan mengunci mereka keluar secara permanen, dan
            bersamanya dari seluruh zona DNS yang mereka kelola.

  /audit:
    get:
      tags: [Akun]
      summary: Jejak organisasi Anda
      description: |
        Setiap PERUBAHAN terhadap data organisasi ini, termasuk
        perubahan yang dilakukan operator DNSCloud.

        Pembacaan TIDAK tercatat di sini — mencatat setiap bacaan membuat
        halaman ini didominasi baris yang tidak mengubah apa pun.

        `org_id` pada jejak selalu berarti organisasi yang DATANYA
        disentuh — tidak pernah organisasi si pelaku — sehingga baris
        yang muncul di sini benar-benar hanya milik Anda.

        Operator DNSCloud tampil sebagai "Operator DNSCloud" dengan
        pengenal tetap, bukan alamat surel: pengenalnya cukup untuk tahu
        apakah tiga bacaan berasal dari satu orang, sementara surel
        karyawan adalah data pribadi mereka sekaligus bahan phishing.

        `detail` hanya memuat field yang di-daftar-putih per aksi; aksi
        yang tidak dikenali memulangkan detail kosong, bukan isi mentah.
      parameters:
        - { name: aksi, in: query, schema: { type: string } }
        - { name: batas, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
        - { name: kursor, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  kursor_berikut: { type: string, nullable: true }
                  jejak:
                    type: array
                    items:
                      type: object
                      properties:
                        waktu: { type: string, format: date-time }
                        aksi: { type: string }
                        pelaku: { type: string }
                        pelaku_id: { type: string, format: uuid, nullable: true }
                        sumber: { type: string, description: Nama domain bila aksinya menyangkut satu domain. }
                        detail: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Validasi' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/zones/{id}/isi:
    get:
      tags: [Operator]
      summary: Buka isi satu domain pelanggan
      description: |
        Membaca record dan pengaturan satu domain untuk memeriksa
        keluhan. SATU domain per permintaan — tidak ada mode seluruh
        platform.

        Pembacaan TIDAK masuk `audit_logs` dan tidak tampil di
        `GET /v1/audit`: jejak pelanggan memuat PERUBAHAN, bukan bacaan.
        Ia dicatat di log server sebagai telemetri internal.

        `alasan` opsional. Ia ikut ke log server dan dipulangkan kembali
        di respons, tetapi tidak pernah sampai ke pemilik domain.

        Sesi yang lolos 2FA memakai KODE PEMULIHAN ditolak 403 di sini
        walau lolos gerbang operator biasa.

        Yang TIDAK pernah dipulangkan, dan disebutkan di `dikecualikan`
        pada respons: komentar record, alamat surel pada kebijakan
        akses, rahasia TOTP identitas akses, dan nilai token API.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: alasan
          in: query
          description: Keterangan bebas untuk log server. Tidak tampil di jejak pelanggan.
          schema: { type: string }
        - name: bagian
          in: query
          description: "Dipisah koma. Bawaan: records."
          schema: { type: string, example: 'records,proksi,dnssec' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  zona: { type: object, additionalProperties: true }
                  records: { type: array, items: { type: object, additionalProperties: true } }
                  proksi: { type: array, items: { type: object, additionalProperties: true } }
                  waf: { type: object, additionalProperties: true }
                  akses: { type: array, items: { type: object, additionalProperties: true } }
                  lb: { type: array, items: { type: object, additionalProperties: true } }
                  dnssec: { type: object, additionalProperties: true }
                  dikecualikan: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Validasi' }
        '403': { description: Bukan operator, sesi lolos lewat kode pemulihan, atau memakai token API }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/summary:
    get:
      tags: [Zona]
      summary: Empat angka keadaan akun
      description: |
        Dihitung atas SELURUH zona organisasi, bukan atas halaman yang
        sedang dibuka, dan SENGAJA tidak menerima penyaring pencarian —
        angka yang bergeser saat orang mengetik adalah angka yang
        berhenti dipercaya.

        Tamu domain menerima angka yang hanya mencakup domain yang
        dihibahkan kepadanya.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  aktif: { type: integer }
                  dnssec_aktif: { type: integer }
                  perlu_tindakan: { type: integer }

  /zones:
    get:
      tags: [Zona]
      summary: Daftar zona
      description: |
        Berurut ALFABET menurut nama punycode, dengan paginasi keyset.

        `search` dicocokkan ke nama punycode; istilah non-ASCII
        dikonversi lebih dulu, sehingga pemilik domain IDN dapat
        mengetik namanya sebagaimana ia membacanya.

        `next_cursor` bernilai `null` berarti HABIS — bukan "coba lagi
        nanti". Kursor membawa sidik penyaring: memakainya setelah
        mengubah `search`, `status`, atau `needs_action` dijawab 400,
        bukan diam-diam memulangkan halaman yang tidak nyambung.

        Empat angka di atas tabel ada di `/zones/summary`, bukan di sini
        — ia menjawab keadaan AKUN, bukan halaman yang sedang dibuka.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ZoneStatus' } }
        - name: needs_action
          in: query
          description: Hanya zona yang menuntut tindakan pemiliknya (moved, suspended_*, inactive).
          schema: { type: boolean }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones: { type: array, items: { $ref: '#/components/schemas/Zone' } }
                  next_cursor:
                    type: string
                    nullable: true
                    description: null berarti habis.
        '400': { $ref: '#/components/responses/Validasi' }
    post:
      tags: [Zona]
      summary: Buat zona
      description: |
        Zona langsung dipublikasikan ke nameserver walaupun statusnya masih
        `pending_verification`. Ini disengaja: begitu Anda mengubah NS di
        registrar, resolusi langsung bekerja tanpa menunggu siklus
        verifikasi kami.

        Respons membawa instruksi delegasi karena Anda pasti membutuhkannya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Domain terdaftar (mis. `contoh.id`), bukan subdomain. IDN diterima dan dikonversi ke punycode.
                  examples: ['contoh.id', 'café.id']
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone: { $ref: '#/components/schemas/Zone' }
                  delegation:
                    type: object
                    properties:
                      nameservers: { type: array, items: { type: string } }
                      instruksi: { type: string }
        '409': { description: '`ZONE_EXISTS` — zona sudah terdaftar; ajukan klaim lewat verifikasi TXT' }
        '403': { description: '`QUOTA_EXCEEDED` — kuota zona tercapai' }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Zona]
      summary: Detail zona
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone: { $ref: '#/components/schemas/Zone' }
                  nameservers: { type: array, items: { type: string } }
                  propagation: { type: array, items: { $ref: '#/components/schemas/NSStatus' } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Zona]
      summary: Hapus zona (soft-delete)
      description: |
        Zona langsung dicabut dari nameserver, tetapi datanya ditahan 7
        hari sehingga penghapusan yang tidak disengaja masih dapat
        dipulihkan.
      responses: { '204': { description: Dihapus } }

  /zones/{zone}/export:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Zona]
      summary: Ekspor file zona
      description: |
        Menghasilkan file zona RFC 1035 yang dapat dimuat langsung oleh
        BIND, Knot, NSD, atau PowerDNS. Ini janji anti-lock-in yang bisa
        Anda uji sendiri.
      responses:
        '200':
          content: { text/dns: { schema: { type: string } } }

  /zones/{zone}/changes:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Zona]
      summary: Riwayat perubahan
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 50 } }]
      responses: { '200': { description: Daftar changeset beserta diff before/after } }

  /zones/{zone}/propagation:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Zona]
      summary: Status propagasi per nameserver
      description: |
        Melaporkan SETIAP nameserver secara terpisah. Keadaan yang paling
        penting diketahui — satu node tertinggal sementara yang lain sudah
        terbarui — hilang bila diringkas menjadi satu status.
      responses: { '200': { description: Serial per nameserver } }

  /zones/{zone}/proxy:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Proxy]
      summary: Daftar hostname yang diproksikan
      description: |
        Setiap nama yang ditandai proxy di domain ini, beserta setelannya.

        Nama yang record-nya bertanda proxy tetapi belum punya baris
        setelan tetap muncul, dengan nilai bawaan. Tanpa itu, sebuah nama
        yang ditandai di luar panel akan diproksikan di DNS dan tidak
        terlihat di sini — dan pemiliknya tidak dapat mematikannya.
      responses:
        '200':
          description: Daftar hostname beserta setelan proxy dan WAF-nya.
  /zones/{zone}/akses:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Proxy]
      summary: Kebijakan akses terkendali domain ini
      description: |
        Gerbang yang berdiri di depan sebuah nama — atau satu awalan
        jalur di bawahnya — sebelum satu byte pun diteruskan ke server
        asal: daftar alamat IP, dan/atau alamat surel beserta kode
        Google Authenticator.

        Yang dilindungi biasanya bukan situs publiknya melainkan yang
        menempel padanya: `/wp-admin`, staging, dasbor internal, panel
        yang lupa ditutup.

        ## Jalur terpanjang menang

        `jalur` adalah AWALAN, dan yang paling panjang yang cocok
        dipakai. `contoh.id/wp-admin` karena itu dapat lebih ketat
        daripada `contoh.id/`, dan daftar ini dikembalikan dalam urutan
        pencocokannya — bukan urutan pembuatan.

        ## `wajib` dan `pintas`

        `wajib` = daftar IP DAN identitas keduanya harus lolos. Alamat
        di luar daftar tidak pernah melihat form masuk.

        `pintas` = alamat di daftar lolos tanpa login; sisanya wajib
        email + kode. Ini bentuk "dari kantor bebas, dari luar wajib
        OTP".

        Bawaannya `wajib`, dan itu arah kegagalan yang benar: kebijakan
        yang salah setel menolak terlalu banyak orang, bukan terlalu
        sedikit.

        ## Identitas didaftarkan PEMILIK

        Tidak ada pendaftaran sendiri. `POST /zones/{zone}/akses-identitas`
        mengembalikan QR SEKALI; pemilik meneruskannya ke orangnya.
        Konsekuensinya disengaja: tidak ada jalur di mana orang yang
        menebak alamat surel yang ada di daftar dapat mengklaimnya lebih
        dulu.

        ## Yang TIDAK pernah dikirim ke node tepi

        Daftar email dan rahasia TOTP. Node hanya tahu APAKAH identitas
        diminta; siapa yang boleh diputuskan control plane saat orangnya
        benar-benar masuk. Cuplikan yang tersimpan di disk setiap node
        karena itu tidak memuat satu alamat surel pelanggan pun.

        ## Dijual per paket

        Fitur ini tidak tersedia pada setiap paket. Jawaban memuat
        `aktif` (diturunkan dari `max_kebijakan_akses > 0`, bukan
        disimpan terpisah) beserta ketiga batasnya, supaya panel dapat
        mengatakan sisa kuotanya **sebelum** tombol ditekan alih-alih
        sesudah penyimpanan ditolak:

        | batas | cakupan | arti nol |
        |---|---|---|
        | `max_kebijakan_akses` | per domain | fitur tidak dijual |
        | `max_identitas_akses` | per domain | gerbang hanya berbasis IP |
        | `max_ip_per_kebijakan` | per gerbang | gerbang hanya berbasis identitas |

        Pelanggaran ketiganya dijawab **403** — ini soal apa yang dijual,
        bukan bentuk data — dengan `code` `ACCESS_NOT_AVAILABLE`,
        `ACCESS_QUOTA_EXCEEDED`, `ACCESS_IDENTITY_QUOTA_EXCEEDED`, atau
        `ACCESS_IP_QUOTA_EXCEEDED`, dan kalimat yang menyebut nama paket
        beserta angkanya.

        **Daftar ini dan seluruh penghapusan TIDAK pernah ditutup 403.**
        Gerbang yang sudah terkirim ke node tetap menahan orang setelah
        paketnya turun — cuplikan disimpan tanpa TTL dan pembangunnya
        sengaja tidak memeriksa paket, karena tanggal tagihan yang lewat
        tidak boleh diam-diam MEMBUKA `/wp-admin` pelanggan. Karena itu
        pemilik harus tetap dapat melihat gerbang yang masih berdiri atas
        namanya, dan mematikannya. Menyalakan kembali gerbang yang
        dimatikan menuntut paket; mematikannya tidak.
      responses:
        '200':
          description: Kebijakan beserta identitas yang terdaftar
          content:
            application/json:
              schema:
                type: object
                required: [kebijakan, identitas]
                properties:
                  kebijakan:
                    type: array
                    items: { $ref: '#/components/schemas/AksesKebijakan' }
                  identitas:
                    type: array
                    items: { $ref: '#/components/schemas/AksesIdentitas' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Proxy]
      summary: Buat kebijakan akses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama]
              properties:
                nama:
                  type: string
                  description: 'Relatif terhadap apex: `@`, `www`, `*`.'
                jalur:
                  type: string
                  default: '/'
                  description: 'Awalan, wajib dibuka `/`. `/` = seluruh nama.'
                mode: { type: string, enum: [wajib, pintas], default: wajib }
                sesi_menit: { type: integer, minimum: 5, maximum: 10080, default: 480 }
                catatan: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Kebijakan dibuat — masih TERBUKA sampai diisi aturan
          content:
            application/json:
              schema:
                type: object
                properties:
                  kebijakan: { $ref: '#/components/schemas/AksesKebijakan' }
        '409':
          description: Sudah ada kebijakan untuk (nama, jalur) itu.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/akses/{id}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Proxy]
      summary: Ubah kebijakan akses
      description: |
        Field yang tidak disebut tidak diubah. Mengubah `mode`
        MENAIKKAN `epoch`, sehingga sesi yang sudah terbit di bawah mode
        lama berhenti berlaku pada permintaan berikutnya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:       { type: string, enum: [wajib, pintas] }
                aktif:      { type: boolean }
                sesi_menit: { type: integer, minimum: 5, maximum: 10080 }
                catatan:    { type: string, maxLength: 200 }
      responses:
        '200':
          description: Kebijakan sesudah perubahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  kebijakan: { $ref: '#/components/schemas/AksesKebijakan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validasi' }
    delete:
      tags: [Proxy]
      summary: Hapus kebijakan akses
      description: |
        Gerbangnya hilang dan jalur itu kembali terbuka untuk umum pada
        cuplikan berikutnya. Identitas TIDAK ikut terhapus — ia milik
        zona, dan dipakai bersama oleh kebijakan lain.
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/{zone}/akses/{id}/ip:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Proxy]
      summary: Tambah blok alamat
      description: |
        Alamat tunggal diterima dan dinaikkan sendiri menjadi `/32` atau
        `/128`. Blok yang bit host-nya terisi (`103.10.20.7/24`)
        di-mask lebih dulu, bukan ditolak.

        Menambah alamat MENAIKKAN `epoch`: pada mode `pintas` ia
        melonggarkan gerbang, pada `wajib` ia mengetatkannya, dan
        keduanya mengubah siapa yang boleh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              properties:
                cidr:    { type: string, example: '103.10.20.0/24' }
                catatan: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Kebijakan sesudah perubahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  kebijakan: { $ref: '#/components/schemas/AksesKebijakan' }
        '409':
          description: Blok itu sudah ada di daftar.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/akses/{id}/ip/{aturan}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: aturan, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Proxy]
      summary: Hapus blok alamat
      responses:
        '200':
          description: Kebijakan sesudah perubahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  kebijakan: { $ref: '#/components/schemas/AksesKebijakan' }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/{zone}/akses/{id}/email:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Proxy]
      summary: Tambah entri email
      description: |
        Dua bentuk:

        · `orang@contoh.id` — satu alamat, persis.
        · `@contoh.id` — SELURUH alamat di domain itu.

        Bentuk kedua yang membuat fitur ini dapat dipakai tim: pemilik
        tidak perlu menambah baris setiap kali ada orang baru. Ia tetap
        harus mendaftarkan QR orang itu — daftar ini menjawab "siapa
        yang boleh", bukan "siapa yang sudah punya authenticator".

        `contoh.id` tanpa `@` DITOLAK: ia tidak akan cocok dengan satu
        alamat pun, sehingga gerbangnya menolak semua orang sementara
        panel menampilkan daftar yang tampak benar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pola]
              properties:
                pola:    { type: string, example: '@contoh.id' }
                catatan: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Kebijakan sesudah perubahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  kebijakan: { $ref: '#/components/schemas/AksesKebijakan' }
        '409':
          description: Entri itu sudah ada di daftar.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/akses/{id}/email/{aturan}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: aturan, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Proxy]
      summary: Hapus entri email
      description: |
        PENCABUTAN SEKETIKA. `epoch` naik, sehingga sesi yang sudah
        dipegang orang itu berhenti berlaku pada permintaan berikutnya —
        bukan setelah sesinya kedaluwarsa.
      responses:
        '200':
          description: Kebijakan sesudah perubahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  kebijakan: { $ref: '#/components/schemas/AksesKebijakan' }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/{zone}/akses-identitas:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    post:
      tags: [Proxy]
      summary: Daftarkan satu orang beserta QR-nya
      description: |
        Mengembalikan `uri` (otpauth://) dan `rahasia` SEKALI. Keduanya
        tidak pernah dapat dibaca lagi sesudah jawaban ini: rahasia yang
        dapat diambil ulang dari API adalah rahasia yang bocor bersama
        satu token panel yang dicuri. Yang kehilangan QR-nya menghapus
        entrinya dan membuat yang baru.

        Identitas melekat pada ZONA, bukan pada kebijakan: satu orang
        memasang satu entri di aplikasinya dan memakainya untuk setiap
        kebijakan di domain itu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: |
            Terdaftar. Jawaban ini ber-`Cache-Control: no-store` karena
            memuat rahasia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identitas:
                    allOf:
                      - $ref: '#/components/schemas/AksesIdentitas'
                      - type: object
                        properties:
                          uri:     { type: string, example: 'otpauth://totp/...' }
                          rahasia: { type: string }
        '409':
          description: Alamat itu sudah terdaftar di domain ini.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/akses-identitas/{id}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Proxy]
      summary: Hapus identitas
      description: |
        Menghentikan login BERIKUTNYA. Sesi yang sudah berjalan tidak
        ikut berakhir — `epoch` melekat pada kebijakan, bukan pada
        orang, dan menaikkan seluruh epoch akan mengeluarkan semua orang
        dari semua jalur setiap kali satu orang keluar. Yang ingin
        mengeluarkan seseorang seketika menghapus emailnya dari daftar
        kebijakan.
      responses:
        '204': { description: Terhapus }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/{zone}/parkir:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Proxy]
      summary: Teks halaman parkir domain ini
      description: |
        Halaman parkir adalah yang dijawab tepi untuk nama yang menunjuk
        kami TANPA server asal.

        ## Mengapa setiap domain baru memilikinya

        Zona baru lahir dengan `@` dan `www` menunjuk kolam tepi. Tanpa
        itu, domain yang delegasinya baru saja dipindahkan menjawab
        NXDOMAIN — dan dari sisi peramban, NXDOMAIN tidak dapat
        dibedakan dari "pemindahan saya gagal". Halaman parkir adalah
        satu-satunya bukti yang dapat dilihat pemiliknya DARI LUAR bahwa
        delegasinya bekerja.

        ## `aktif` adalah izin, `diparkir` adalah keadaan

        `aktif: false` mematikan halaman parkir untuk domain ini; nama
        tanpa server asal lalu kembali menjawab galat `DC_1006`. Itu
        jawaban yang benar bagi pemilik yang SEDANG menyiapkan asalnya
        dan tidak ingin pengunjungnya melihat halaman perkenalan kami.

        `diparkir` menyebut apakah halaman itu benar-benar sedang tayang
        SEKARANG, dan `nama_diparkir` menyebut nama mana. Begitu pemilik
        mengarahkan sebuah nama ke alamat server asalnya sendiri, nama
        itu hilang dari daftar tanpa satu pun setelan yang perlu diubah.

        ## Judul dan pesan kosong berarti bawaan, bukan kosong

        Kalimat bawaan hidup di node tepi, tidak disalin ke sini.
        Menyalinnya akan membekukannya: memperbaiki satu kata setahun
        kemudian tidak akan menyentuh satu pun domain yang sudah ada.
      responses:
        '200':
          description: Teks dan keadaan halaman parkir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parkir' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Proxy]
      summary: Ubah teks halaman parkir
      description: |
        Field yang TIDAK disebut tidak diubah. `judul` atau `pesan` yang
        dikirim sebagai string kosong mengembalikannya ke kalimat bawaan
        node.

        `taut_url` dan `taut_teks` berpasangan: isi keduanya, atau
        kosongkan keduanya. Skema yang diterima hanya `http` dan
        `https` — alamat itu dirender node sebagai `href` pada halaman
        yang dilihat pengunjung.

        TIDAK menuntut paket berproxy. Halaman parkir tidak meneruskan
        satu byte pun ke server pelanggan dan tidak menjalankan WAF; ia
        jawaban atas nama yang kami arahkan ke diri kami sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aktif:     { type: boolean }
                judul:     { type: string, maxLength: 120 }
                pesan:     { type: string, maxLength: 600 }
                taut_url:  { type: string, maxLength: 300 }
                taut_teks: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Teks sesudah perubahan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parkir' }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/proxy/{name}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: 'Nama record relatif, `@` untuk apex, `*` untuk wildcard'
    put:
      tags: [Proxy]
      summary: Nyalakan, matikan, atau ubah setelan proxy satu nama
      description: |
        Satuannya HOSTNAME, bukan record. Menandai per record menghasilkan
        RRset yang separuh diproksikan, dan separuh itu berarti sebagian
        resolver mengembalikan alamat asal: perlindungan yang dapat
        dilewati dengan mengulang satu kueri DNS bukan perlindungan.
        Karena itu seluruh record beralamat pada satu nama dinyalakan dan
        dimatikan bersama.

        Menyalakan proxy MENGGANTI alamat yang diterbitkan DNS dengan
        alamat kolam tepi, dan menaikkan versi zona. Mengubah setelan
        lain — mode WAF, batas laju, alamat server asal — TIDAK menyentuh
        DNS sama sekali dan tidak menaikkan versi zona. Itu efek yang
        disengaja: proxy memutus hubungan antara perubahan server asal
        dan perubahan DNS.

        Nama yang hanya punya CNAME atau ALIAS DITOLAK. Node tepi sengaja
        tidak punya resolver — itulah yang menutup seluruh kelas serangan
        yang mengarahkan proxy ke jaringan internal lewat nama — sehingga
        yang dikirim kepadanya harus berupa alamat.

        Seluruh field opsional dan bersifat "yang tidak disebut tidak
        diubah", supaya satu sakelar dapat dikirim tanpa mengembalikan
        setelan lain ke bawaannya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proxied: { type: boolean, description: 'Salurkan lewat tepi DNSCloud' }
                mode_tls:
                  type: string
                  enum: [mati, fleksibel, penuh, ketat]
                  description: |
                    Sambungan dari tepi ke server asal. `mati` = HTTP polos,
                    `fleksibel` = HTTPS tanpa memverifikasi sertifikat asal,
                    `penuh` = verifikasi rantai, `ketat` = verifikasi rantai
                    dan nama.
                mode_waf:
                  type: string
                  enum: [mati, pantau, blokir]
                  description: |
                    Bawaannya `blokir`, termasuk pada paket gratis. Mode
                    deteksi-saja menjual "situs Anda terlindungi" sambil
                    tidak melindungi apa pun.
                paranoia:
                  type: integer
                  minimum: 0
                  maximum: 4
                  description: |
                    Tingkat WAF. Lebih tinggi menangkap lebih banyak, dan juga
                    memblokir lebih banyak permintaan yang sah.

                    `0` adalah profil DASAR: HANYA paket tanda tangan, dan
                    OWASP CRS tidak dijalankan sama sekali (seluruh rentang
                    900000-999999 dicabut). Nol positif palsu.

                    Yang HILANG di `0`, dan ini harus disampaikan ke pengguna
                    akhir: deteksi SQL injection, XSS, path traversal tidak
                    tersandi, dan shell code. Serangan berbentuk itu diteruskan
                    ke server asal. Paket `tanda-tangan` dinyalakan otomatis
                    oleh tingkat ini walau tidak diminta.

                    `1`–`4` adalah tingkat paranoia OWASP CRS apa adanya.

                    Dibatasi paket, KECUALI `0` yang tersedia di semua paket.
                ambang_masuk: { type: integer, description: 'Skor anomali yang memicu blokir permintaan' }
                ambang_keluar: { type: integer, description: 'Skor anomali yang memicu blokir respons' }
                batas_badan_kb:
                  type: integer
                  description: |
                    Ukuran badan permintaan yang masih DIPERIKSA WAF. Yang
                    melewatinya diteruskan tanpa pemeriksaan, dan itu
                    dihitung sebagai lubang yang terlihat di metrik.
                ip_per_menit: { type: integer, description: 'Batas permintaan per alamat pengunjung' }
                situs_per_menit: { type: integer, description: 'Batas permintaan seluruh situs' }
                paket_aturan:
                  type: array
                  items: { type: string, enum: [disusupi, tanda-tangan] }
                  description: |
                    Paket aturan WAF terkelola yang dinyalakan host ini.
                    MENGGANTI seluruh daftar: kirim [] untuk mematikan semuanya,
                    dan hilangkan field-nya untuk membiarkannya apa adanya.

                    Nama dibakukan saat disimpan: huruf kecil, tanpa spasi tepi,
                    tanpa duplikat.

                    `disusupi` memblokir jalur bercirikan konten judi yang
                    disisipkan ke situs yang diretas, dan berkas yang dapat
                    dieksekusi di direktori unggahan.

                    `tanda-tangan` memblokir LANGSUNG pola yang tidak punya
                    makna sah — traversal tersandi, byte null, permintaan
                    berkas rahasia (.env, kunci SSH, kredensial), dan penanda
                    eksploit yang diketahui. Ia tidak menyumbang skor anomali,
                    jadi ia bekerja sama di setiap tingkat WAF termasuk Dasar.

                    Dijaga PAKET LANGGANAN, KECUALI `tanda-tangan` yang
                    tersedia di semua paket. Paket berlangganan yang tidak
                    termasuk langganan dijawab 403 PROXY_RULE_PACK_NOT_IN_PLAN;
                    nama yang tidak dikenal dijawab 400
                    PROXY_RULE_PACK_UNKNOWN.
                origin_host:
                  type: string
                  description: |
                    ALAMAT IP server asal, menimpa isi record. Harus alamat,
                    bukan nama, dan tidak boleh privat, loopback, atau
                    link-local.
                origin_port: { type: integer }
                origin_sni: { type: string, description: 'SNI yang dikirim ke server asal' }
      responses:
        '200':
          description: Setelan yang berlaku setelah perubahan.
    delete:
      tags: [Proxy]
      summary: Matikan proxy untuk satu nama
      description: |
        DNS kembali menerbitkan alamat asal pada penerbitan berikutnya,
        dan setelan WAF nama ini dihapus. Menyimpan setelan untuk nama
        yang tidak diproksikan berarti panel menampilkan setelan yang
        tidak berlaku.
      responses:
        '204':
          description: Proxy dimatikan.
  /zones/{zone}/waf-rules:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Proxy]
      summary: Daftar aturan WAF domain ini
      description: |
        Dikembalikan dalam urutan yang BERLAKU. Yang pertama cocok yang
        memutuskan — bukan yang paling spesifik. Aturan "paling spesifik
        menang" terdengar lebih pintar dan menghasilkan sistem yang tidak
        dapat dijelaskan kepada orang yang aturannya tidak menyala.
      responses:
        '200':
          description: Aturan, terurut menurut `urutan`.
    post:
      tags: [Proxy]
      summary: Tambah aturan WAF
      description: |
        Kondisi bersifat TERSTRUKTUR, bukan bahasa ekspresi. Bahasa
        ekspresi menuntut parser di node tepi, pada jalur panas, atas
        masukan yang ditulis pelanggan; bentuk terstruktur divalidasi
        sekali di sini, sebelum ia pernah menyentuh sebuah node.

        Seluruh syarat di dalam `kondisi.semua` harus cocok (DAN); nilai
        di dalam satu syarat cukup salah satu (ATAU).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WafRuleInput'
      responses:
        '201':
          description: Aturan dibuat.
  /zones/{zone}/waf-rules/{rule}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - name: rule
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Proxy]
      summary: Ubah aturan WAF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WafRuleInput'
      responses:
        '200':
          description: Aturan setelah perubahan.
    delete:
      tags: [Proxy]
      summary: Hapus aturan WAF
      responses:
        '204':
          description: Aturan dihapus.
  /zones/{zone}/waf-events:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Proxy]
      summary: Peristiwa WAF domain ini, beserta ringkasannya
      description: |
        Permintaan yang **tidak diloloskan**: yang diblokir, ditantang,
        dipantau, atau dibatasi lajunya. Baris `lolos` tidak pernah ada —
        mencatat yang lolos berarti mencatat setiap pengunjung setiap
        pelanggan. Jumlah permintaan seluruhnya hidup di metrik lalu
        lintas, yang dihitung tanpa satu pun keterangan tentang orang.

        ## Setiap permintaan membawa rentang waktu

        Tabelnya dipartisi harian menurut `at`, dan partisi hanya
        dipangkas bila predikatnya membatasi kolom itu. Karena itu, bila
        `sejak` tidak dikirim server menetapkannya sendiri: 24 jam
        terakhir, atau seluruh jendela retensi bila `ray` diisi.

        ## Jendela diklem ke retensi paket

        `jendela` pada respons adalah rentang yang SESUNGGUHNYA dipakai,
        bukan yang diminta. `diklem: true` berarti permintaan melebihi
        `retensi_hari` paket domain ini dan dipotong. Bila seluruh
        rentang yang diminta lebih tua daripada retensi, `sejak` dan
        `sampai` menjadi sama dan hasilnya kosong — itu jawaban "lebih
        tua daripada yang kami simpan", bukan "tidak ada serangan".

        ## Ringkasan hanya pada halaman pertama

        `ringkasan` terikat pada JENDELA, bukan pada halaman, jadi ia
        dihitung sekali dan bernilai `null` pada permintaan yang membawa
        `kursor`. Simpan yang diterima di halaman pertama.

        ## Paginasi keyset, bukan offset

        `kursor_berikut` bersifat opaque. Kirim balik apa adanya bersama
        `sejak` dan `sampai` dari `jendela`, supaya halaman berikutnya
        memakai jendela yang sama. Kursor yang rusak, tidak lengkap, atau
        berasal dari penyaring lain ditolak dengan
        `422 WAF_EVENT_CURSOR_INVALID` — ia sengaja tidak diperlakukan
        sebagai "mulai dari awal", karena halaman pertama yang menyamar
        sebagai halaman berikutnya terlihat seperti daftar yang habis.
      parameters:
        - name: sejak
          in: query
          schema: { type: string, format: date-time }
          description: 'RFC3339. Bawaan `now-24h`, atau awal jendela retensi bila `ray` diisi.'
        - name: sampai
          in: query
          schema: { type: string, format: date-time }
          description: 'RFC3339. Bawaan `now`.'
        - name: aksi
          in: query
          style: form
          explode: true
          description: |
            Boleh berulang (`?aksi=blokir&aksi=pantau`). Nilai yang tidak
            dikenal DITOLAK, bukan diabaikan: penyaring yang diabaikan
            mengembalikan lebih banyak daripada yang diminta, dan
            pembacanya tetap yakin hasilnya tersaring.
          schema:
            type: array
            items: { type: string, enum: [blokir, tantang, pantau, batasi_laju] }
        - name: hostname
          in: query
          schema: { type: string }
          description: 'Cocok persis, tidak peka huruf besar/kecil.'
        - name: ray
          in: query
          schema: { type: string }
          description: |
            Nomor yang dibawa pengunjung dari halaman blokir. Bila diisi,
            jendela bawaannya melebar ke SELURUH retensi paket — nomor itu
            baru sampai ke pemilik situs setelah berhari-hari, lewat surel
            atau tiket.
        - name: kursor
          in: query
          schema: { type: string }
          description: 'Opaque, dari `kursor_berikut` respons sebelumnya.'
        - name: batas
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Ringkasan dan baris, keduanya terikat jendela yang sama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WafEvents' }
        '403':
          description: |
            Paket domain ini tidak memuat proxy tepi
            (`PROXY_NOT_AVAILABLE`). Sengaja BUKAN 404 dan bukan daftar
            kosong: keduanya membuat "tidak dijual" terlihat persis
            seperti "tidak ada serangan".
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          $ref: '#/components/responses/Validasi'
  /zones/{zone}/rrsets:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Record]
      summary: Daftar RRset
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  rrsets: { type: array, items: { $ref: '#/components/schemas/RRset' } }
                  warnings:
                    type: [array, 'null']
                    description: Peringatan non-blocking — konfigurasi yang sah menurut RFC tetapi hampir pasti bukan yang dimaksud.
                    items: { $ref: '#/components/schemas/Warning' }
    put:
      tags: [Record]
      summary: Perubahan massal (atomik)
      description: |
        Semua-atau-gagal, menghasilkan SATU entri riwayat. Inilah endpoint
        yang dipakai alat otomasi untuk menerapkan konfigurasi zona penuh
        tanpa risiko meninggalkan zona setengah jadi bila ada satu record
        yang tidak valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upserts:
                  type: array
                  items:
                    type: object
                    required: [name, type, records]
                    properties:
                      name: { type: string }
                      type: { type: string }
                      ttl: { type: integer }
                      records: { type: array, items: { type: object } }
                      comment: { type: string }
                deletes:
                  type: array
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name: { type: string }
                      type: { type: string }
      responses:
        '200': { description: Diterapkan }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/rrsets/{name}/{type}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: name, in: path, required: true, schema: { type: string }, description: 'Nama relatif; `@` untuk apex' }
      - { name: type, in: path, required: true, schema: { type: string } }
    put:
      tags: [Record]
      summary: Buat atau perbarui satu RRset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                ttl: { type: integer, default: 300, minimum: 60, maximum: 86400 }
                records:
                  type: array
                  minItems: 1
                  description: Rdata terstruktur; bentuknya bergantung tipe record.
                  items: { type: object }
                comment: { type: string, maxLength: 500 }
            examples:
              A:
                value: { ttl: 300, records: [{ ip: '103.10.20.30' }, { ip: '103.10.20.31' }], comment: 'web utama' }
              MX:
                value: { ttl: 3600, records: [{ preference: 10, exchange: 'mail.contoh.id.' }] }
              TXT:
                summary: Teks > 255 byte dipecah otomatis menjadi beberapa character-string
                value: { ttl: 3600, records: [{ text: 'v=spf1 include:_spf.penyedia.id -all' }] }
              CAA:
                value: { ttl: 3600, records: [{ flags: 0, tag: 'issue', value: 'letsencrypt.org' }] }
      responses:
        '200': { description: Tersimpan; propagasi berjalan asinkron }
        '403': { description: '`SYSTEM_MANAGED_RECORD` — SOA & NS apex dikelola sistem' }
        '422': { $ref: '#/components/responses/Validasi' }
    delete:
      tags: [Record]
      summary: Hapus satu RRset
      responses:
        '204': { description: Dihapus }
        '404': { description: '`RRSET_NOT_FOUND`' }

  /zones/{zone}/grants:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Domain]
      summary: Siapa saja yang dapat mengakses domain ini
      description: >
        Mengembalikan SELURUH pihak yang dapat menyentuh domain ini, bukan
        hanya penerima hibah per-domain. Anggota organisasi ikut tampil
        dengan `source: organisasi` karena aksesnya berasal dari perannya
        dan tidak dapat dicabut dari sini — daftar yang menyembunyikan
        mereka adalah daftar yang salah.
      responses:
        '200':
          description: Daftar akses
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        email: { type: string }
                        name: { type: string }
                        role:
                          type: string
                          description: >
                            Peran hibah (`editor`/`viewer`) bila
                            `source: hibah`; peran organisasi bila
                            `source: organisasi`.
                        source:
                          type: string
                          enum: [hibah, organisasi]
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Domain]
      summary: Bagikan domain ini kepada satu alamat email
      description: >
        Yang diundang menjadi anggota berperan `guest`, yang tidak punya
        satu pun izin organisasi — seluruh aksesnya berasal dari hibah
        per-domain. Mengundang orang yang SUDAH punya hibah untuk domain
        ini mengubah perannya, bukan gagal.


        Menolak bila alamatnya sudah anggota organisasi dengan peran
        nyata: ia sudah dapat mengakses seluruh domain lewat perannya, dan
        menambahkan hibah akan menampilkan orang yang sama dua kali dengan
        dua peran yang berbeda.


        Menolak pula bila belum ada akun dengan alamat itu. Membuat akun
        atas nama orang lain berarti menduduki alamat emailnya sebelum ia
        pernah membuktikan memilikinya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [editor, viewer]
                  default: viewer
      responses:
        '204': { description: Domain dibagikan }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /zones/{zone}/grants/{user}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - name: user
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: UUID pengguna yang hibahnya dicabut.
    delete:
      tags: [Domain]
      summary: Cabut akses seseorang atas domain ini
      description: >
        Barisnya DIHAPUS, bukan ditandai dicabut: baris yang tampak mati
        tetapi masih terbaca oleh satu query yang lupa menyaringnya adalah
        bentuk kebocoran yang paling sulit dilihat. Riwayatnya hidup di
        audit log.


        Keanggotaan `guest` yang tidak lagi memegang hibah apa pun ikut
        dibuang, supaya organisasi tidak mengumpulkan anggota tanpa akses
        ke apa pun.


        Mengembalikan 404 bila orang itu tidak punya hibah atas domain
        ini — termasuk ketika aksesnya sebenarnya berasal dari peran
        organisasi. Menjawab 204 di situ akan membuat pemilik percaya
        akses yang tidak tercabut sudah tercabut.
      responses:
        '204': { description: Akses dicabut }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/{zone}/dnssec:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [DNSSEC]
      summary: Status DNSSEC & record DS
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  dnssec: { $ref: '#/components/schemas/DnssecStatus' }
                  panduan: { type: string }
    post:
      tags: [DNSSEC]
      summary: Aktifkan DNSSEC
      description: |
        Satu aksi. Kami membuat kunci CSK (ECDSA P-256, algoritma 13),
        menandatangani zona dengan NSEC3 sesuai RFC 9276, dan menyajikan
        record DS siap salin — dalam hitungan detik.

        Dijalankan asinkron: tanggapan `202` berarti pekerjaan diantrikan.
        Ambil DS lewat `GET` beberapa saat kemudian.
      responses:
        '202': { description: Diproses }
        '409': { description: '`DNSSEC_ALREADY_ENABLED`' }
    delete:
      tags: [DNSSEC]
      summary: Nonaktifkan DNSSEC
      description: |
        **Ditolak selama DS masih terpasang di registrar.** Mencabut tanda
        tangan sementara zona induk masih mengumumkan DS membuat setiap
        resolver yang memvalidasi menolak SELURUH jawaban zona — domainnya
        mati total, bukan sekadar tidak terlindungi.
      parameters:
        - name: saya_paham_risikonya
          in: query
          schema: { type: boolean }
          description: Lewati pengaman setelah Anda memastikan DS sudah dicabut di registrar.
      responses:
        '202': { description: Diproses }
        '409': { description: '`DS_STILL_AT_PARENT`' }

  /zones/{zone}/dnssec/check:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    post:
      tags: [DNSSEC]
      summary: Minta pemeriksaan rantai DNSSEC sekarang
      description: |
        Menggeser jadwal pemeriksaan rantai ke depan antrian. Query DNS ke
        induk TIDAK dijalankan di dalam permintaan ini — induk yang lambat
        harus menahan pekerja latar belakang, bukan menahan koneksi Anda.

        Pemeriksaan otomatis sendiri beriramanya mengikuti keadaan: 15
        menit selama masih ada yang ditunggu (baru diaktifkan, DS belum
        terlihat, atau DS tidak cocok), melebar dengan backoff sampai 6
        jam, dan 6 jam bagi rantai yang sudah utuh. Endpoint ini untuk
        saat Anda baru memasang DS dan tidak ingin menunggu siklus
        berikutnya.

        Dibatasi satu kali per menit per zona. Batasnya berkunci pada
        ZONA, bukan pada pemanggil: yang dilindungi adalah nameserver
        induk milik registry, bukan sumber daya kami.
      responses:
        '202':
          description: Masuk antrian dengan prioritas
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  detail: { type: string }
                  catatan: { type: string }
        '409': { description: '`CONFLICT` — DNSSEC belum aktif untuk zona ini' }
        '429': { description: '`RATE_LIMITED` — beserta `Retry-After`' }

  /oauth/register:
    post:
      tags: [OAuth]
      summary: Pendaftaran klien dinamis (RFC 7591)
      security: []
      description: |
        Mendaftarkan klien OAuth publik. Dipakai Claude.ai, ChatGPT, dan
        klien MCP lain yang mendaftar sendiri sebelum ada pengguna yang
        masuk.

        Hanya klien PUBLIK yang diterbitkan: tidak ada `client_secret`,
        dan PKCE S256 wajib. Seluruh klien MCP yang disasar berjalan di
        perangkat pengguna, tempat rahasia yang disematkan bukan rahasia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: { type: string }
                redirect_uris:
                  type: array
                  items: { type: string }
                  maxItems: 8
                  description: Dicocokkan PERSIS saat otorisasi. HTTPS, atau HTTP pada localhost, atau skema aplikasi.
      responses:
        '201': { description: Klien terdaftar }
        '422': { $ref: '#/components/responses/Validasi' }

  /oauth/token:
    post:
      tags: [OAuth]
      summary: Tukar kode, atau perbarui token
      security: []
      description: |
        `grant_type=authorization_code` menukar kode otorisasi menjadi
        token akses, dan `grant_type=refresh_token` memperbaruinya.
        Refresh token DIROTASI: yang lama dicabut begitu yang baru
        diterbitkan.

        Kode yang dipakai dua kali menyebabkan SELURUH akses aplikasi itu
        dicabut — pemakaian ulang adalah tanda kebocoran, bukan
        kelalaian.

        Galatnya berbentuk OAuth (`error`, `error_description`), bukan
        problem+json, karena itu yang diurai klien OAuth.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
      responses:
        '200': { description: Token diterbitkan }
        '400': { description: '`invalid_grant` atau `invalid_request` dalam bentuk galat OAuth' }

  /oauth/revoke:
    post:
      tags: [OAuth]
      summary: Cabut token atau refresh token (RFC 7009)
      security: []
      description: |
        Selalu menjawab 200, bahkan untuk token yang tidak dikenal —
        membedakannya berarti endpoint ini menjadi cara menguji apakah
        sebuah token pernah ada.
      responses:
        '200': { description: Dicabut bila ada }

  /oauth/permintaan:
    get:
      tags: [OAuth]
      summary: Rincian permintaan otorisasi untuk layar persetujuan
      description: |
        Dipakai panel untuk menampilkan aplikasi apa yang meminta, cakupan
        apa, dan ke mana pengguna akan dikembalikan. Terpisah dari
        persetujuannya sendiri supaya permintaan yang cacat ditolak
        SEBELUM pemiliknya melihat tombol "Izinkan".
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        '200': { description: Rincian permintaan }
        '422': { $ref: '#/components/responses/Validasi' }

  /oauth/setujui:
    post:
      tags: [OAuth]
      summary: Setujui permintaan dan terbitkan kode otorisasi
      description: |
        Hanya dapat dipanggil dari SESI panel, tidak dengan token API:
        token yang dapat menyetujui aplikasi berarti satu token yang bocor
        dapat menerbitkan akses permanen untuk aplikasi pilihan penyerang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Query string permintaan otorisasi, apa adanya.
      responses:
        '200': { description: Berisi redirect_uri lengkap dengan code, state, dan iss }
        '403': { description: Dipanggil dengan token API, bukan sesi panel }

  /zones/{zone}/load-balancers:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Load Balancer]
      summary: Daftar load balancer domain ini
      responses:
        '200':
          description: |
            Daftar load balancer, masing-masing dengan `origin_count`,
            `healthy_count` (sudah diperiksa dan menjawab), dan
            `serving_count` (sedang ikut dijawab DNS — termasuk origin yang
            belum pernah diperiksa). Dua yang terakhir sengaja tidak sama.

            Jawaban ini juga memuat keadaan paket (`enabled`,
            `max_load_balancer`, `max_origin_per_lb`,
            `cek_interval_min_detik`) dan TIDAK ditutup 403 pada paket yang
            tidak mengizinkan fitur ini: domain yang paketnya baru turun
            masih melayani load balancer-nya, dan pemiliknya harus dapat
            melihat apa yang sedang menjawab atas namanya.
    post:
      tags: [Load Balancer]
      summary: Buat load balancer
      description: |
        Sebuah load balancer MENGELOLA satu RRset di dalam domain ini.
        Isinya dihitung ulang setiap kali kesehatan origin berubah, lalu
        diterbitkan lewat jalur yang sama dengan record biasa.

        Nama yang sudah dipakai record buatan pelanggan ditolak: load
        balancer menulis RRset bertanda sistem, dan menimpanya di atas
        suntingan pelanggan berarti menghapusnya tanpa ia setujui.

        Hanya tersedia pada paket yang mengizinkannya. Paket gratis
        memberi nol, dan nol berarti fitur mati.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 'Nama record relatif, `@` untuk apex' }
                type: { type: string, enum: [A, AAAA], default: A }
                policy: { type: string, enum: [round_robin, weighted, failover], default: round_robin }
                ttl: { type: integer, minimum: 30, maximum: 300, default: 60 }
                when_all_unhealthy:
                  type: string
                  enum: [sajikan_semua, sajikan_terakhir_sehat]
                  default: sajikan_semua
                  description: |
                    Perilaku saat tidak ada origin yang sehat. Bawaannya
                    menyajikan seluruh origin apa adanya: RRset kosong
                    berarti domainnya mati total, jauh lebih buruk
                    daripada mengembalikan alamat yang mungkin mati.
                check_protocol: { type: string, enum: [http, https, tcp], default: https }
                check_port: { type: integer, default: 443 }
                check_path: { type: string, default: '/' }
                check_host:
                  type: string
                  description: Host header dan SNI. Tanpanya yang diperiksa adalah situs bawaan origin.
                check_interval_seconds:
                  type: integer
                  description: Dinaikkan ke lantai paket bila lebih rapat daripada yang diizinkan.
                check_timeout_seconds: { type: integer, minimum: 1, maximum: 30, default: 5 }
                check_failure_threshold: { type: integer, minimum: 1, maximum: 10, default: 3 }
                check_recovery_threshold: { type: integer, minimum: 1, maximum: 10, default: 2 }
      responses:
        '201': { description: Dibuat }
        '403': { description: '`QUOTA_EXCEEDED` — paket domain ini tidak mengizinkan load balancer' }
        '409': { description: '`CONFLICT` — nama sudah dipakai record atau load balancer lain' }
        '429': { description: '`QUOTA_EXCEEDED` — batas jumlah load balancer tercapai' }

  /zones/{zone}/load-balancers/{lb}:
    patch:
      tags: [Load Balancer]
      summary: Ubah setelan load balancer
      description: |
        Menyunting kebijakan, TTL, perilaku saat semua origin sakit, dan
        seluruh setelan pemeriksaan. Hanya bidang yang dikirim yang
        berubah; sisanya dipertahankan apa adanya.

        `name` dan `type` TIDAK dapat diubah dan permintaan yang memuat
        keduanya ditolak. Keduanya menentukan RRset yang dikelola load
        balancer ini — menggantinya berarti membuat RRset baru sambil
        meninggalkan yang lama tetap dijawab nameserver tanpa pemilik.
        Untuk pindah nama: hapus, lalu buat.

        Setiap perubahan diterbitkan ulang seketika.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { type: string, enum: [round_robin, weighted, failover] }
                ttl:
                  type: integer
                  minimum: 30
                  maximum: 300
                  description: >-
                    Tidak boleh lebih pendek daripada `cek_interval_min_detik`
                    paket (dibatasi 300, yaitu TTL tertinggi yang diterima).
                    TTL di bawah jarak pemeriksaan menjanjikan perpindahan
                    lebih cepat daripada yang dapat dideteksi.
                when_all_unhealthy: { type: string, enum: [sajikan_semua, sajikan_terakhir_sehat] }
                enabled: { type: boolean }
                check_protocol: { type: string, enum: [http, https, tcp] }
                check_port: { type: integer }
                check_path: { type: string }
                check_host: { type: string }
                check_interval_seconds:
                  type: integer
                  description: 'Dinaikkan otomatis ke lantai interval paket bila lebih kecil.'
                check_timeout_seconds: { type: integer, minimum: 1, maximum: 30 }
                check_failure_threshold: { type: integer, minimum: 1, maximum: 10 }
                check_recovery_threshold: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '204': { description: Tersimpan dan diterbitkan ulang }
        '400': { description: Nilai tidak sah, atau memuat name/type }
        '404': { description: Load balancer tidak ditemukan }
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: lb, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Load Balancer]
      summary: Hapus load balancer
      description: RRset yang dikelolanya ikut dibuang, dan zona diterbitkan ulang.
      responses:
        '204': { description: Dihapus }

  /zones/{zone}/load-balancers/{lb}/health:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: lb, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Load Balancer]
      summary: Kesehatan tiap origin
      description: |
        Keadaan tiap origin beserta hasil pemeriksaan terakhir dan jumlah
        gangguan 30 hari terakhir. Keadaan `belum` berarti origin belum
        pernah diperiksa — dibedakan dari `sakit`, karena keduanya
        menuntut kalimat yang berbeda.
      responses:
        '200': { description: Daftar origin beserta kesehatannya }

  /zones/{zone}/load-balancers/{lb}/origins:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: lb, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Load Balancer]
      summary: Tambah origin
      description: |
        `address` harus berupa ALAMAT IP, bukan nama host. Jawaban A/AAAA
        memang berupa alamat, dan meresolusi nama di sisi kami membuka
        jalur yang tidak dapat diamankan: nama yang menunjuk alamat publik
        saat divalidasi dapat menunjuk alamat internal saat disambungi.

        Alamat pada rentang privat, loopback, link-local (termasuk endpoint
        metadata cloud), CGNAT, dan rentang khusus lain ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: 'Alamat IPv4 atau IPv6 publik' }
                weight: { type: integer, minimum: 1, maximum: 100, default: 1 }
                priority: { type: integer, minimum: 0, default: 0, description: 'Dipakai kebijakan failover; kecil = lebih dulu' }
      responses:
        '201': { description: Ditambahkan; zona langsung diterbitkan ulang }
        '422': { $ref: '#/components/responses/Validasi' }
        '429': { description: '`QUOTA_EXCEEDED` — batas origin per load balancer tercapai' }

  /zones/{zone}/load-balancers/{lb}/origins/{origin}:
    parameters:
      - { $ref: '#/components/parameters/Zone' }
      - { name: lb, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: origin, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Load Balancer]
      summary: Hapus origin
      responses:
        '204': { description: Dihapus; zona langsung diterbitkan ulang }

  /tokens:
    get:
      tags: [Token]
      summary: Daftar token API
      responses: { '200': { description: Daftar token (tanpa nilai token) } }
    post:
      tags: [Token]
      summary: Buat token API
      description: |
        Hanya dapat dipanggil dari sesi panel, tidak dengan token lain.

        Nilai token ditampilkan **sekali** pada respons ini. Kami menyimpan
        hash-nya saja, sehingga kami sendiri tidak dapat menampilkannya lagi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string, enum: ['zones:read', 'zones:write', 'dnssec:manage', 'account:read'] }
                zone_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Batasi token ke zona tertentu. Kosong = seluruh zona organisasi.
                expires_at: { type: string, format: date-time }
      responses:
        '201': { description: Token dibuat — salin nilainya sekarang }
        '403': { description: Dipanggil dengan token API, bukan sesi panel }
  /tokens/{id}:
    delete:
      tags: [Token]
      summary: Cabut token
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Dicabut } }

  /auth/totp/setup:
    post:
      tags: [Autentikasi]
      summary: Mulai pengaktifan 2FA
      description: |
        Menghasilkan rahasia baru beserta URI `otpauth://` untuk kode QR.
        Rahasia disimpan sebagai *pending* dan belum berlaku — 2FA baru
        aktif setelah dikonfirmasi lewat `/auth/totp/enable`. Pemisahan ini
        mencegah keadaan di mana pengguna punya 2FA menyala dengan rahasia
        yang tidak dimiliki siapa pun.
      responses: { '200': { description: Rahasia & URI QR } }

  /auth/totp/enable:
    post:
      tags: [Autentikasi]
      summary: Konfirmasi & aktifkan 2FA
      description: Mengembalikan kode pemulihan **satu kali** — tidak dapat ditampilkan lagi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses: { '200': { description: Aktif; kode pemulihan disertakan } }

  /auth/totp/verify:
    post:
      tags: [Autentikasi]
      summary: Selesaikan tantangan 2FA saat masuk
      description: |
        Menerima kode enam digit **atau** salah satu kode pemulihan pada
        kolom yang sama. Sebelum ini dipanggil, sesi berada dalam keadaan
        setengah terautentikasi dan seluruh endpoint lain menolak dengan
        `TOTP_REQUIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '204': { description: Terverifikasi }
        '401': { description: Kode salah }

  /auth/totp/disable:
    post:
      tags: [Autentikasi]
      summary: Nonaktifkan 2FA
      description: |
        Memerlukan kode 2FA yang valid — menonaktifkan pengaman harus
        dilindungi pengaman itu sendiri, agar sesi yang dibajak tidak dapat
        melepasnya. Ditolak untuk akun operator platform.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses: { '204': { description: Nonaktif } }

  /zones/{zone}/import:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    post:
      tags: [Zona]
      summary: Impor file zona
      description: |
        **Default-nya PRATINJAU.** Tambahkan `?commit=true` untuk benar-benar
        menerapkan.

        Default yang aman disengaja: impor mengganti isi DNS produksi
        berdasarkan berkas yang disalin dari penyedia lain. Respons selalu
        memuat daftar record yang DILEWATI beserta alasannya — migrasi yang
        diam-diam kehilangan record jauh lebih berbahaya daripada yang gagal
        terang-terangan.

        Menerima berkas mentah (`text/dns`) atau JSON `{"zone_file": "…"}`.
      parameters:
        - { name: commit, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          text/dns: { schema: { type: string } }
          application/json:
            schema: { type: object, properties: { zone_file: { type: string } } }
      responses:
        '200':
          description: Pratinjau — belum ada yang berubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HasilImport' }
        '201':
          description: Diterapkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HasilImport' }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/rollback/preview:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Zona]
      summary: Pratinjau rollback
      parameters: [{ name: version, in: query, required: true, schema: { type: integer } }]
      responses: { '200': { description: Daftar perubahan yang akan diterapkan } }

  /zones/{zone}/rollback:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    post:
      tags: [Zona]
      summary: Kembalikan zona ke versi sebelumnya
      description: |
        Menghasilkan changeset **BARU** berisi keadaan lama; riwayat tidak
        pernah ditulis ulang. Record yang dikelola sistem (NS apex) tidak
        ikut dikembalikan — mengembalikannya dapat memutus delegasi zona
        dari platform.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        '200': { description: Dikembalikan }
        '422': { $ref: '#/components/responses/Validasi' }

  /zones/{zone}/verification:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    get:
      tags: [Zona]
      summary: Status verifikasi delegasi
      responses: { '200': { description: Hasil pemeriksaan terakhir & jadwal berikutnya } }

  /zones/{zone}/verification/check:
    parameters: [{ $ref: '#/components/parameters/Zone' }]
    post:
      tags: [Zona]
      summary: Antrekan pemeriksaan delegasi
      description: |
        Permintaan DIANTREKAN, tidak dijalankan di dalam permintaan ini.

        Sebelumnya endpoint ini menempuh root → TLD → nameserver induk
        sambil pemanggil menunggu. Dua akibatnya sama-sama buruk: satu
        tombol di panel menjadi cara termurah membebani nameserver pihak
        ketiga atas nama kami, dan permintaan HTTP kami bergantung pada
        jaringan di luar kendali kami.

        Antriannya SATU dan sama dengan sapuan otomatis; yang membedakan
        hanya prioritas — permintaan manual mendahului sapuan terjadwal,
        dan prioritasnya dilepas begitu diperiksa supaya zona lain tetap
        mendapat giliran.

        Dibatasi satu kali per menit per zona. Pembatasan ini melindungi
        zona induk di luar sana.

        Hasilnya dibaca dari `GET /zones/{zone}/verification`, biasanya
        beberapa detik kemudian.
      responses:
        '202':
          description: Pemeriksaan masuk antrian
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  detail: { type: string }
                  catatan: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Terlalu sering; lihat `Retry-After` }

  # ── Organisasi & keanggotaan (FR-1.3) ─────────────────────
  #
  # SELURUH endpoint di bawah menolak token API dengan 403.
  #
  # Ia mengelola identitas dan keanggotaan, bukan data DNS, dan semuanya
  # bertumpu pada "siapa Anda" — pertanyaan yang tidak dijawab token.
  # Sebelumnya rute-rute ini hanya dijaga matriks peran, yang sengaja
  # meloloskan token; karena tidak satu pun memasang scope, token apa pun
  # lolos.

  /members:
    get:
      tags: [Organisasi]
      summary: Anggota organisasi & undangan tertunda
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string, format: email }
                        name: { type: string }
                        role: { type: string, enum: [owner, admin, editor, viewer] }
                        role_label: { type: string }
                        joined_at: { type: string, format: date-time }
                        totp_enabled: { type: boolean }
                        is_self: { type: boolean }
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string, format: email }
                        role: { type: string }
                        expires_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        description: { type: string }
                  my_role: { type: string }
                  my_permissions: { type: array, items: { type: string } }
        '403': { description: Dipanggil dengan token API, bukan sesi panel }

  /members/invites:
    post:
      tags: [Organisasi]
      summary: Undang anggota baru
      description: |
        Menghasilkan tautan undangan sekali pakai yang berlaku 7 hari, dan
        mengirimkannya lewat email. Tautannya juga dikembalikan sekali di
        sini agar pengundang dapat menyampaikannya sendiri.

        Hanya Pemilik yang dapat mengundang Pemilik lain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, editor, viewer] }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  role: { type: string }
                  invite_url: { type: string }
                  expires_at: { type: string, format: date-time }
                  catatan: { type: string }
        '403': { description: Peran tidak berizin, atau dipanggil dengan token API }
        '409': { description: Sudah menjadi anggota organisasi ini }
        '422': { $ref: '#/components/responses/Validasi' }

  /members/invites/{id}:
    delete:
      tags: [Organisasi]
      summary: Cabut undangan yang belum diterima
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Undangan dicabut }
        '403': { description: Peran tidak berizin, atau dipanggil dengan token API }
        '404': { $ref: '#/components/responses/NotFound' }

  /members/{id}:
    patch:
      tags: [Organisasi]
      summary: Ubah peran anggota
      description: |
        Menurunkan peran ikut MENCABUT token API yang dibuat orang itu:
        token membawa scope-nya sendiri dan tidak pernah diperiksa ulang
        terhadap peran pembuatnya.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { type: string, enum: [owner, admin, editor, viewer] } }
      responses:
        '204': { description: Peran diubah }
        '403': { description: Peran tidak berizin, atau dipanggil dengan token API }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Organisasi harus memiliki minimal satu Pemilik }
    delete:
      tags: [Organisasi]
      summary: Keluarkan anggota
      description: |
        Mencabut SELURUH akses orang itu dalam satu transaksi: keanggotaan,
        token API yang ia buat untuk organisasi ini, dan sesi panelnya.

        Tanpa pencabutan itu, token lama tetap sah tanpa batas waktu —
        `api_tokens` menyimpan `org_id`, bukan ikatan ke keanggotaan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Anggota dikeluarkan; token & sesinya dicabut }
        '403': { description: Peran tidak berizin, atau dipanggil dengan token API }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Pemilik terakhir tidak dapat keluar }

  /invites/accept:
    post:
      tags: [Organisasi]
      summary: Terima undangan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id: { type: string, format: uuid }
                  role: { type: string }
        '403': { description: Dipanggil dengan token API, bukan sesi panel }
        '422': { $ref: '#/components/responses/Validasi' }

  /orgs:
    get:
      tags: [Organisasi]
      summary: Organisasi yang diikuti pengguna
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        role: { type: string }
                        role_label: { type: string }
                        active: { type: boolean }
        '403': { description: Dipanggil dengan token API, bukan sesi panel }

  /orgs/nameservers:
    get:
      tags: [Organisasi]
      summary: Pasangan nameserver organisasi (WARISAN)
      description: |
        **Jangan pakai ini untuk mendelegasikan domain.** Sejak pasangan
        nameserver menjadi milik DOMAIN, bukan organisasi, nilai di sini
        tidak berlaku untuk zona yang dibuat setelahnya — dan memasangnya
        di registrar akan membuat delegasi domain tersebut tidak pernah
        terverifikasi.

        Nameserver yang benar untuk sebuah domain dikembalikan
        `GET /zones/{zone}` pada field `nameservers`.

        Endpoint ini dipertahankan untuk organisasi WARISAN — yang
        memakai pasangan global dari sebelum kolam nameserver ada, dan
        yang zona-zona LAMANYA memang berbagi satu pasangan. Zona yang
        dibuat sesudahnya memperoleh pasangannya sendiri dari kolam,
        termasuk milik organisasi warisan, jadi nilai di sini bukan
        jawaban untuk domain mana pun yang baru. Untuk organisasi lain
        ia mengembalikan daftar kosong.

        Pasangan tetap merupakan delegasi **dan** buktinya: mengarahkan
        NS di registrar sekaligus membuktikan kepemilikan, karena hanya
        pemilik sah yang dapat mengubahnya di registrar. Yang berubah
        hanyalah cakupannya — kini per domain.

        Token API diizinkan di sini — klien yang mengotomatiskan delegasi
        perlu tahu pasangan mana yang harus dipasang.

        Organisasi yang dibuat sebelum kolam nameserver diperkenalkan
        dapat belum punya pasangan; jawabannya lalu berupa daftar
        **kosong**. Klien tidak boleh mengganti kekosongan itu dengan
        nameserver bersama platform: delegasi ke nameserver yang bukan
        pasangan organisasi tidak akan pernah memverifikasi zonanya.
      responses:
        '200':
          description: Pasangan nameserver
          content:
            application/json:
              schema:
                type: object
                required: [nameservers]
                properties:
                  nameservers:
                    type: array
                    maxItems: 2
                    items: { type: string, example: arum.ns.dnscloud.id. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orgs/{id}/switch:
    post:
      tags: [Organisasi]
      summary: Ganti organisasi yang sedang dikerjakan
      description: |
        Pilihan disimpan di SESI, bukan di akun — satu orang dapat membuka
        dua organisasi berbeda di dua peramban.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Konteks organisasi diganti }
        '403': { description: Bukan anggota organisasi itu, atau dipanggil dengan token API }

  /operator/edge/key:
    get:
      tags: [Operator]
      summary: Kunci publik penandatangan cuplikan tepi
      description: |
        Nilai inilah yang dipasang di `CUPLIKAN_KUNCI_PUBLIK` pada setiap
        node tepi. Kunci PRIVAT tidak pernah meninggalkan basis data
        control plane, dan tidak ada endpoint yang dapat membacanya.
      responses:
        '200':
          description: Kunci publik ed25519, base64 standar.
  /operator/edge/pools:
    get:
      tags: [Operator]
      summary: Daftar kolam tepi
      description: |
        Kolam membawa alamat yang DITERBITKAN di DNS untuk setiap nama
        yang diproksikan padanya — bukan alamat node. Perbedaan itu
        menentukan biayanya: mengubah alamat kolam berarti satu
        penandatanganan ulang dan dua AXFR penuh untuk SETIAP zona yang
        diproksikan.
      responses:
        '200':
          description: Kolam beserta jumlah node dan zona yang memakainya.
    post:
      tags: [Operator]
      summary: Buat kolam tepi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, nama]
              properties:
                kode: { type: string }
                nama: { type: string }
                ip4:
                  type: array
                  items: { type: string }
                  description: |
                    Alamat IPv4 yang diterbitkan. Alamat privat, loopback,
                    atau link-local ditolak: ia akan diterbitkan di DNS
                    untuk setiap domain yang diproksikan, dan tidak dapat
                    dijangkau siapa pun.
                ip6:
                  type: array
                  items: { type: string }
                ttl_publikasi: { type: integer, minimum: 60, maximum: 3600, default: 300 }
      responses:
        '201':
          description: Kolam dibuat, belum in_service.
  /operator/edge/pools/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Operator]
      summary: Ubah kolam tepi
      description: |
        Alamat dan `in_service` diubah dalam SATU pernyataan supaya
        pemeriksaan skema menilai keadaan akhirnya: kolam tidak boleh
        sempat berstatus melayani tanpa satu pun alamat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama: { type: string }
                ip4: { type: array, items: { type: string } }
                ip6: { type: array, items: { type: string } }
                ttl_publikasi: { type: integer }
                in_service: { type: boolean }
      responses:
        '204':
          description: Kolam diubah.
  /operator/edge/nodes:
    get:
      tags: [Operator]
      summary: Daftar node tepi
      description: |
        Termasuk `umur_cuplikan_detik`: umur konfigurasi yang sedang
        DISAJIKAN node itu. Node yang menyajikan cuplikan berumur tiga
        hari sehat menurut setiap ukuran lain — ia menjawab, punya
        sertifikat, cepat. Ia hanya merutekan pelanggan yang memindahkan
        server asalnya kemarin ke alamat lama.
      responses:
        '200':
          description: Node beserta versi, umur cuplikan, dan galat terakhirnya.
    post:
      tags: [Operator]
      summary: Daftarkan node tepi
      description: |
        Node baru SELALU dibuat dengan `in_service=false`. Node yang
        langsung menerima trafik saat didaftarkan berarti pelanggan
        dilayani sebuah mesin sebelum ada yang memeriksa mesin itu
        benar-benar menjawab.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string }
                pool_id: { type: string, format: uuid, description: 'Kosong memakai kolam bawaan' }
                probe_addr: { type: string }
                ip4: { type: string }
                ip6: { type: string }
                wg_addr: { type: string, description: 'Alamat WireGuard node' }
                location: { type: string }
      responses:
        '201':
          description: Node terdaftar, belum melayani.
  /operator/edge/nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Operator]
      summary: Ubah node tepi
      description: |
        `in_service` di sini adalah penanda OPERASIONAL, bukan sakelar
        trafik. Yang menentukan ke mana trafik dikirim adalah alamat
        kolam. Keduanya sengaja dipisah: node dipasang dan dipantau
        dulu, alamatnya ditambahkan ke kolam belakangan, sebagai
        tindakan tersendiri yang disadari.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                in_service: { type: boolean }
                location: { type: string }
                probe_addr: { type: string }
      responses:
        '204':
          description: Node diubah.
  /operator/edge/nodes/{id}/tokens:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Operator]
      summary: Terbitkan token node
      description: |
        Token dikembalikan SEKALI dan tidak pernah dapat dibaca lagi —
        yang disimpan hanyalah hash-nya.

        Token lama TIDAK dicabut oleh operasi ini. Rotasi yang mencabut
        lebih dulu mengunci node yang gagal menulis token barunya ke
        disk, dan node yang terkunci dari control plane tidak punya
        jalan kembali selain kunjungan operator ke mesinnya.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                umur_hari: { type: integer, default: 90 }
                ip_terikat:
                  type: string
                  description: |
                    Mengikat token ke alamat WireGuard node. Sangat
                    disarankan: token yang dicuri dari disk lalu dipakai
                    dari internet publik berhenti di sini, dan itu bentuk
                    kebocoran yang paling mungkin (snapshot VM, cadangan,
                    kesalahan salin).
      responses:
        '201':
          description: Token dan kunci publik cuplikan.
  /operator/edge/tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Operator]
      summary: Cabut token node
      description: |
        Mencabut token menghentikan node BELAJAR hal baru. Ia TIDAK
        menghentikan node menyajikan cuplikan yang sudah ia pegang —
        cuplikan tidak pernah kedaluwarsa untuk penyajian, karena DNS
        adalah sakelar matinya.

        Untuk benar-benar menghentikan node yang dikompromikan:
        keluarkan alamatnya dari kolam dan terbitkan ulang.
      responses:
        '204':
          description: Token dicabut.
  /operator/nameservers:
    get:
      tags: [Operator]
      summary: Node nameserver fisik dan kolam label
      description: |
        Mengembalikan DUA hal yang berbeda, dan mencampurnya adalah
        kesalahan yang paling mahal di layar ini.

        `nameservers` adalah node FISIK — mesin yang benar-benar menjawab
        query, beserta alamat IP-nya. Jumlahnya sedikit, biasanya dua.

        `pool` adalah LABEL yang dipakai menyusun pasangan per domain.
        Seluruhnya resolve ke IP node fisik yang sama; yang membedakan
        satu domain dari lainnya hanya NAMANYA. Karena itu pertanyaan
        "IP-nya menunjuk ke mana" hanya punya satu jawaban untuk seluruh
        kolam.

        `dipakai` pada tiap label dihitung dari `zones.ns_a/ns_b` — bukan
        dari organisasi, karena sejak pasangan menjadi milik domain,
        organisasi tidak lagi menyatakan label mana yang terpasang di
        registrar.
      responses:
        '200':
          description: Node dan kolam
          content:
            application/json:
              schema:
                type: object
                properties:
                  ns_domain: { type: string }
                  nameservers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        hostname: { type: string }
                        probe_addr: { type: string }
                        ip4: { type: string, nullable: true }
                        ip6: { type: string, nullable: true }
                        software: { type: string, enum: [bind, nsd, knot, powerdns] }
                        role: { type: string, enum: [slave, primary] }
                        location: { type: string, nullable: true }
                        in_service: { type: boolean }
                        tsig_key_name: { type: string, nullable: true }
                  pool:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        fqdn: { type: string }
                        in_service: { type: boolean }
                        dipakai: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operator]
      summary: Daftarkan node nameserver fisik
      description: |
        `probe_addr` WAJIB berisi port. checkd menanyakan node ini secara
        langsung tanpa meresolusi hostname-nya — justru karena resolusi
        itulah yang sedang diperiksa. Alamat tanpa port membuat query
        gagal dengan pesan jaringan yang tidak menyebut sebabnya, dan node
        itu tampil "gangguan" selamanya.

        Bawaannya `in_service: false`. Node yang baru didaftarkan belum
        tentu sudah menerima transfer zona; memasukkannya ke pemantauan
        seketika membuat halaman status merah untuk sesuatu yang memang
        belum siap, dan operator belajar mengabaikan warna merah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, probe_addr]
              properties:
                hostname: { type: string }
                probe_addr: { type: string, example: '103.10.20.30:53' }
                ip4: { type: string, nullable: true }
                ip6: { type: string, nullable: true }
                software: { type: string, enum: [bind, nsd, knot, powerdns], default: bind }
                role: { type: string, enum: [slave, primary], default: slave }
                location: { type: string, nullable: true }
                in_service: { type: boolean, default: false }
      responses:
        '201':
          description: Terdaftar
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/nameservers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Operator]
      summary: Ubah node nameserver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, probe_addr]
              properties:
                hostname: { type: string }
                probe_addr: { type: string }
                ip4: { type: string, nullable: true }
                ip6: { type: string, nullable: true }
                software: { type: string, enum: [bind, nsd, knot, powerdns] }
                role: { type: string, enum: [slave, primary] }
                location: { type: string, nullable: true }
                in_service: { type: boolean }
      responses:
        '204': { description: Diubah }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Operator]
      summary: Hapus node nameserver
      description: |
        Menolak menghapus node TERAKHIR yang masih melayani. Menghapusnya
        menghentikan seluruh domain pelanggan sekaligus, dan tidak ada
        langkah berikutnya yang dapat memulihkannya lebih cepat daripada
        memasang node baru dari nol.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /zones/{zone}/plan:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Paket]
      summary: Paket berlangganan domain ini, beserta pemakaiannya
      description: |
        Berlangganan melekat pada DOMAIN, bukan pada akun. Satu akun
        lazim memegang domain dengan nilai yang sangat berbeda, dan paket
        per akun memaksa membayar tingkat tertinggi untuk seluruhnya.

        Jawaban memuat BATAS dan PEMAKAIAN sekaligus. Batas tanpa
        pemakaian menuntut pelanggan menghitung sendiri berapa yang
        tersisa — dan pada batas harian, menghitungnya berarti membuka
        riwayat lalu menjumlahkan baris hari ini.

        Paket berbayar yang sudah lewat `berlaku_sampai` dilaporkan
        sebagai paket bawaan seketika; tidak ada jendela ketika batas
        lama masih berlaku sambil menunggu sapuan.

        `min_ttl_detik` adalah TTL terendah yang boleh disimpan pelanggan
        pada paket ini; nol berarti hanya batas teknis 60 detik yang
        berlaku. Ia dikirim supaya panel dapat MENYEBUT batasnya di
        formulir record alih-alih menunggu penyimpanan ditolak. Record
        yang dikelola sistem — RRset milik load balancer dan NS apex —
        tidak terkena lantai ini; tanpa pengecualian itu load balancer,
        yang menuntut TTL 30–300 detik agar failover-nya sampai ke
        pengguna, mustahil diterbitkan pada paket berlantai lebih tinggi.

        `load_balancer_terpakai` dikirim bersama `max_load_balancer` dan
        `max_origin_per_lb`, dengan aturan yang sama seperti record dan
        perubahan: batas beserta pemakaian nyatanya.

        `kebijakan_akses_terpakai` dan `identitas_akses_terpakai` mengikuti
        pola yang sama untuk akses terkendali, bersama
        `max_kebijakan_akses`, `max_identitas_akses`, dan
        `max_ip_per_kebijakan`. `max_ip_per_kebijakan` tidak punya
        pasangan "terpakai" karena ia batas PER GERBANG, bukan per
        domain; angka itu bermakna hanya di layar gerbangnya dan datang
        dari `GET /zones/{zone}/akses`.

        ## Pemakaian dihitung tanpa memandang paket, dan itu disengaja

        Domain yang paketnya baru turun TETAP diproksikan, TETAP melayani
        load balancer-nya, dan gerbang aksesnya TETAP menahan orang di
        tepi. Melaporkan pemakaian nol karena batasnya kini nol akan
        menyembunyikan persis keadaan yang paling perlu terbaca — dan
        pada akses terkendali, ia menyembunyikan gerbang yang masih
        berdiri tanpa ada yang tahu.

        `proksi_terpakai` memakai rumus yang SAMA dengan penegaknya:
        nama yang diparkir tidak menghabiskan kuota dan karena itu tidak
        ikut dihitung. Sebelumnya ia dihitung terpisah tanpa pengecualian
        itu, sehingga pelanggan yang memarkir dua nama melihat kuotanya
        habis padahal masih tersisa.
      responses:
        '200':
          description: Paket yang berlaku
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  kode: { type: string, example: gratis }
                  nama: { type: string }
                  max_records: { type: integer, example: 25 }
                  max_perubahan_harian: { type: integer, example: 25 }
                  max_kebijakan_akses:
                    type: integer
                    description: Gerbang akses per domain. 0 = fitur tidak dijual.
                  max_identitas_akses:
                    type: integer
                    description: Identitas ber-authenticator per domain. 0 = gerbang hanya berbasis IP.
                  max_ip_per_kebijakan:
                    type: integer
                    description: Blok alamat per gerbang. 0 = gerbang hanya berbasis identitas.
                  kebijakan_akses_terpakai: { type: integer }
                  identitas_akses_terpakai: { type: integer }
                  api_baca_per_menit: { type: integer, example: 60 }
                  api_tulis_per_menit: { type: integer, example: 10 }
                  jeda_publikasi_detik: { type: integer, example: 30 }
                  bawaan: { type: boolean }
                  berlaku_sampai: { type: string, format: date-time, nullable: true }
                  record_terpakai: { type: integer }
                  maks_paranoia: { type: integer, description: Tingkat paranoia CRS tertinggi yang boleh dipilih. }
                  paket_waf:
                    type: array
                    items: { type: string }
                    description: |
                      Paket aturan WAF terkelola BERLANGGANAN yang boleh dinyalakan.
                      Kosong berarti tidak ada yang berlangganan; panel menampilkan
                      sakelarnya terkunci beserta alasannya.

                      TIDAK memuat paket yang tersedia di semua langganan.
                      `tanda-tangan` karena itu tetap boleh dinyalakan walau daftar
                      ini kosong — daftar ini menyatakan apa yang DIJUAL, bukan apa
                      yang tersedia.
                  perubahan_hari_ini: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /zones/{zone}/redeem:
    parameters:
      - name: zone
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Paket]
      summary: Tebus kode voucher untuk domain ini
      description: |
        Menaikkan paket SATU domain. Voucher menggantikan pembayaran
        untuk sementara; bentuknya sengaja sama dengan yang dibutuhkan
        pembayaran kelak, sehingga jalur pembayaran nanti menyambung ke
        sini alih-alih menggantikannya.

        Perpanjangan MENUMPUK dari tenggat yang ada bila paketnya sama —
        pelanggan yang menebus voucher kedua sebelum yang pertama habis
        tidak kehilangan sisa harinya. Voucher paket berbeda
        menggantikan, karena menumpuk dua paket berbeda tidak punya arti.

        Kode yang tidak ada, kode yang sudah habis, kode yang
        kedaluwarsa, dan kode yang **dinonaktifkan operator** menghasilkan
        pesan yang SAMA. Membedakannya mengubah endpoint ini menjadi alat
        menebak kode.

        Jejak auditnya (`zone.voucher_redeem`) menyebut voucher lewat
        `voucher_id`, **bukan kodenya**. Kode voucher adalah rahasia
        pembawa dan `audit_logs` dibaca operator lain, diekspor per
        organisasi, serta ikut setiap cadangan basis data — satu baris
        yang memuat kodenya menyerahkan sisa kuota voucher itu kepada
        siapa pun yang membacanya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode]
              properties:
                kode: { type: string }
      responses:
        '200':
          description: Voucher ditebus
          content:
            application/json:
              schema:
                type: object
                properties:
                  paket: { type: string }
                  berlaku_sampai: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/plans:
    get:
      tags: [Operator]
      summary: Daftar paket beserta jumlah domain yang memakainya
      responses:
        '200': { description: Daftar paket }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operator]
      summary: Buat paket berbayar
      description: |
        Paket baru SELALU dibuat non-bawaan. Memindahkan paket bawaan
        mengubah batas seluruh domain gratis sekaligus, dan itu tidak
        boleh menjadi efek samping dari membuat paket baru.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaketInput' }
      responses:
        '201': { description: Dibuat }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Operator]
      summary: Ubah batas satu paket
      description: |
        Berlaku SEKETIKA untuk setiap domain yang memakainya — termasuk
        seluruh domain gratis, yang memakai paket bawaan tanpa satu pun
        baris zona menyebutnya. Menaikkan batas gratis karena itu satu
        penyuntingan, bukan migrasi data.

        Batas record di atas 10.000 ditolak: setiap perubahan mengirim
        zona PENUH ke kedua nameserver (ADR-001), sehingga angka itu
        menentukan biaya transfer per penyimpanan dan merupakan keputusan
        engine, bukan setelan paket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaketInput' }
      responses:
        '204': { description: Tersimpan }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/vouchers:
    get:
      tags: [Operator]
      summary: Daftar voucher beserta pemakaiannya
      description: |
        Setiap baris memuat `id` (pengenal untuk rute penyuntingan; kode
        tidak boleh masuk URL), `dinonaktifkan_at` (null berarti hidup —
        waktu, bukan boolean, karena "sejak kapan" adalah pertanyaan
        pertama pada setiap tiket tentang voucher yang berhenti bekerja),
        dan `dapat_dihapus`, yang dihitung server menurut aturan yang sama
        dengan yang ditegakkan `DELETE`.
      responses:
        '200': { description: Daftar voucher }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operator]
      summary: Terbitkan kode voucher
      description: |
        Kode voucher TIDAK dicatat di audit. Audit dapat dibaca operator
        lain, dan kode yang tercetak di sana dapat ditebus siapa pun yang
        membacanya. Yang dicatat adalah bahwa sebuah voucher dibuat, oleh
        siapa, dan untuk paket apa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kode, plan_id, durasi_hari]
              properties:
                kode: { type: string }
                plan_id: { type: string, format: uuid }
                durasi_hari: { type: integer, minimum: 1 }
                max_pakai: { type: integer, minimum: 1, default: 1 }
                berlaku_hari: { type: integer, description: kedaluwarsa voucher itu sendiri }
                catatan: { type: string }
      responses:
        '201':
          description: |
            Diterbitkan. Balasannya memuat `id` — pengenal yang dipakai
            seluruh rute penyuntingan, karena kodenya tidak boleh masuk URL.
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/vouchers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: |
          Pengenal voucher, **bukan kodenya**. Setiap permintaan dicatat
          beserta path-nya, jadi kode di URL akan tertulis ke berkas log —
          dan singgah di riwayat peramban serta header `Referer`. Kode
          voucher adalah rahasia pembawa: siapa pun yang membacanya dapat
          menebusnya. `id` acak tidak mengandung apa pun tentang kodenya.
    patch:
      tags: [Operator]
      summary: Sunting, nonaktifkan, atau aktifkan kembali voucher
      description: |
        Semua medan opsional; yang tidak disebut tidak diubah.

        ## Kode tidak dapat disunting

        `kode` adalah kunci utama yang ditunjuk `voucher_redemptions`,
        jadi menggantinya memutus catatan penebusan yang sudah terjadi —
        dan kode yang sudah terlanjur dibagikan tidak boleh diam-diam
        berubah menjadi kode lain. Untuk mengganti kode: nonaktifkan yang
        lama, terbitkan yang baru.

        ## Nonaktif menghentikan penebusan, bukan yang sudah terjadi

        `nonaktif: true` membuat penebusan berikutnya ditolak dengan
        kalimat yang sama persis dengan kode yang habis atau kedaluwarsa —
        membedakannya akan mengubah endpoint penebusan menjadi alat
        menebak kode. Domain yang sudah menebus TETAP memegang paketnya.
        `nonaktif: false` menghidupkannya kembali.

        Penonaktifan dicatat sebagai aksi audit tersendiri
        (`operator.voucher_disable` / `operator.voucher_enable`), bukan
        dilebur ke `operator.voucher_update`: "siapa mematikan voucher
        ini, kapan" adalah pertanyaan yang benar-benar ditanyakan orang.

        ## Kuota tidak dapat turun di bawah yang sudah ditebus

        `max_pakai` yang lebih kecil daripada `dipakai` ditolak 422 dengan
        angkanya disebut. Untuk menghentikan pemakaian berikutnya tanpa
        menyentuh yang sudah terjadi, pakai `nonaktif`.

        ## Mengganti paket hanya berlaku ke depan

        `plan_id` yang berubah menentukan paket untuk penebusan
        **berikutnya**. Domain yang sudah menebus tetap memegang paket
        yang berlaku saat itu; tidak ada di sini yang mencabutnya.

        Kode voucher tidak pernah masuk audit, begitu pula ISI `catatan` —
        catatan boleh memuat nama pelanggan atau nomor tiket, dan yang
        berguna bagi jejak hanya bahwa ia berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: string, format: uuid }
                durasi_hari: { type: integer, minimum: 1 }
                max_pakai:
                  type: integer
                  minimum: 1
                  description: Tidak boleh lebih kecil daripada `dipakai`.
                berlaku_sampai:
                  type: string
                  description: |
                    RFC3339, atau **string kosong** untuk menghapus
                    tenggatnya. JSON `null` tidak dipakai karena
                    encoding/json memetakan `null` dan "tidak disebut" ke
                    nilai yang sama, sehingga keduanya tidak dapat
                    dibedakan; string kosong bukan stempel waktu yang sah
                    dan karena itu tidak dapat bertabrakan dengan nilai
                    sungguhan.
                catatan: { type: string }
                nonaktif:
                  type: boolean
                  description: |
                    `true` menghentikan penebusan berikutnya; `false`
                    menghidupkannya kembali.
      responses:
        '204': { description: Tersimpan }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Operator]
      summary: Hapus voucher yang belum pernah ditebus
      description: |
        Hanya voucher dengan `dipakai = 0` yang dapat dihapus.

        Baris voucher adalah satu sisi catatan mengapa sebuah domain
        memegang paket berbayar; sisi lainnya ada di
        `voucher_redemptions`, yang menunjuknya lewat foreign key
        `ON DELETE RESTRICT`. Menghapus voucher yang sudah ditebus berarti
        menghapus keterangan atas paket yang masih berjalan — dan
        pertanyaan "kenapa domain ini Pro" berhenti punya jawaban.

        Voucher yang sudah ditebus dijawab **409** dengan kalimat yang
        menyebut jalan keluarnya: nonaktifkan. Daftar voucher menandai
        mana yang dapat dihapus lewat `dapat_dihapus`, dihitung server —
        panel yang menghitungnya sendiri akan menyimpang, dan yang
        menyimpang terlihat sebagai tombol Hapus yang selalu menjawab
        galat.
      responses:
        '204': { description: Terhapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/waf-keywords:
    get:
      tags: [Operator]
      summary: Kosakata paket aturan WAF
      description: |
        Daftar kata yang menyusun paket aturan WAF, termasuk yang
        NONAKTIF.

        Yang nonaktif ikut dengan sengaja: sebuah kata yang pernah
        dimatikan karena salah-blokir harus tetap terlihat beserta
        catatannya, kalau tidak operator berikutnya akan menambahkannya
        lagi dan mengulang insiden yang sama.

        `dipakai` menghitung berapa paket berlangganan yang menyalakan
        paket aturan itu. Nol berarti kosakata ini tidak sedang memeriksa
        satu permintaan pun — daftar yang dirawat untuk paket yang tidak
        dinyalakan di langganan mana pun.
      responses:
        '200':
          description: Kosakata
          content:
            application/json:
              schema:
                type: object
                required: [kata_kunci, paket]
                properties:
                  kata_kunci:
                    type: array
                    items: { $ref: '#/components/schemas/KataKunciWAF' }
                  paket:
                    type: array
                    description: Nama paket aturan yang dikenali server.
                    items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operator]
      summary: Tambah satu kata
      description: |
        Menambahkan satu kata ke sebuah paket dan tingkat.

        Yang dikirim hanya KATA — bentuk aturannya (anchor jalur,
        pembatas segmen, nomor ID) ada di kode tepi dan tidak pernah
        melintasi kawat. Itu batas keamanan: control plane yang dapat
        mengirim SecLang dapat menjalankan aturan sembarang di setiap
        mesin tepi.

        Karena itu `kata` dibatasi huruf kecil, angka, hubung, dan garis
        bawah. Frasa dua kata ditulis dengan hubung (`slot-gacor`);
        spasi dan metakarakter regex ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paket, tingkat, kata]
              properties:
                paket: { type: string, example: disusupi }
                tingkat:
                  type: string
                  enum: [blokir, akar, tandai]
                  description: |
                    `blokir` menolak di mana pun pada jalur; `akar` hanya
                    di segmen pertama — untuk frasa yang sah muncul di
                    URL editorial tetapi tidak sebagai nama folder;
                    `tandai` mencatat tanpa pernah menolak.
                kata:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9_-]{0,62}[a-z0-9])?$'
                  example: slot-gacor
                catatan:
                  type: string
                  maxLength: 500
                  description: Mengapa kata ini ada — dibaca setahun kemudian.
                aktif: { type: boolean, default: true }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/waf-keywords/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Operator]
      summary: Nyalakan, matikan, atau sunting catatan sebuah kata
      description: |
        KATA-nya sendiri tidak dapat diubah, hanya `aktif` dan `catatan`.

        Mengubah kata di tempat akan membuat jejak audit berbohong: baris
        audit lama menyebut kata lama, barisnya kini berisi kata lain,
        dan tidak ada yang mencatat pergantiannya. Mengganti kata berarti
        mematikan yang lama lalu menambah yang baru — dua jejak, keduanya
        benar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aktif: { type: boolean }
                catatan: { type: string, maxLength: 500 }
      responses:
        '204': { description: Tersimpan }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Operator]
      summary: Hapus satu kata permanen
      description: |
        Mematikan hampir selalu pilihan yang lebih baik: kata yang
        dimatikan berhenti memblokir seketika, tetapi catatan mengapa ia
        pernah ada tetap terbaca. Penghapusan disediakan untuk kata yang
        salah ketik, yang tidak ada gunanya disimpan.
      responses:
        '204': { description: Terhapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/accounts:
    get:
      tags: [Operator]
      summary: Daftar akun terdaftar
      description: |
        Disebut AKUN di seluruh antarmuka, meski tabelnya bernama
        `organizations`. Nama tabel dibiarkan: menggantinya menuntut
        migrasi berisiko pada belasan foreign key demi perubahan yang
        tidak dilihat siapa pun kecuali kami.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - name: keadaan
          in: query
          schema: { type: string, enum: [aktif, ditangguhkan] }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: Daftar akun beserta jumlah domain dan anggotanya }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/accounts/{id}/suspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Operator]
      summary: Tangguhkan akun
      description: |
        Menutup akses PANEL dan API akun ini, termasuk lewat token API.
        Menegakkannya hanya pada sesi panel akan membuat penangguhan
        dapat dilewati dengan memakai token — dan otomasi yang
        menyalahgunakan platform justru memakai token.

        Domainnya TETAP DIJAWAB nameserver. Itu disengaja: pemilik domain
        yang menunggak tidak boleh kehilangan email dan situsnya pada
        menit yang sama tagihannya lewat. Menghentikan pelayanan DNS
        adalah tindakan terpisah, per zona.

        Alasan WAJIB: akun yang ditangguhkan akan menghubungi dukungan,
        dan yang menjawab belum tentu yang menangguhkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '204': { description: Ditangguhkan }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/accounts/{id}/unsuspend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Operator]
      summary: Cabut penangguhan akun
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '204': { description: Dicabut }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/waf-events:
    get:
      tags: [Operator]
      summary: Ringkasan peristiwa WAF seluruh platform
      description: |
        Menjawab satu pertanyaan operator: *apa yang sedang terjadi di
        seluruh platform, dan siapa yang kena.* Isinya agregat saja.

        ## Tanpa baris per permintaan DI SINI

        Endpoint ini tidak mengembalikan satu pun baris, dan karena itu
        tidak punya paginasi: tidak ada yang perlu dihalamani. Baris
        mentah lintas seluruh pelanggan di satu jawaban berarti satu
        layar yang memperlihatkan lalu lintas setiap pelanggan sekaligus
        — jangkauan yang tidak dituntut oleh pertanyaan di atas, dan
        kueri tanpa satu pun predikat `zone_id` yang mempersempitnya.

        Barisnya tetap dapat dibaca, tetapi **satu domain pada satu
        waktu**, lewat `GET /operator/waf-events/rows` — yang MENUNTUT
        `zone_id` dan mencatat setiap bacaan di audit.

        Seperti di layar pemilik, baris `lolos` tidak pernah ada. Yang
        tersimpan hanya yang ditahan, ditantang, dipantau, atau dibatasi
        lajunya.

        ## Jendela wajib, dan batasnya keras

        `waf_peristiwa` dipartisi harian menurut `at`, dan partisi hanya
        dipangkas bila predikatnya membatasi kolom itu. Berbeda dari
        layar pemilik, agregat ini **tidak punya** predikat `zone_id`,
        sehingga tidak ada indeks yang dapat mempersempit apa pun: yang
        tersisa hanyalah memindai setiap partisi di dalam jendela.

        Karena itu lebar jendela dibatasi keras pada `maks_hari`
        (**14 hari**), dan lantai itu diukur dari *sekarang* — sehingga
        ia sekaligus membatasi seberapa lebar dan seberapa jauh ke
        belakang. Diukur pada 290.828 baris di 24 zona dan 30 hari
        partisi: 24 jam = 6 ms / 2 partisi, 7 hari = 64 ms / 8 partisi,
        14 hari = 98 ms / 15 partisi, tetapi 21 hari = 274 ms dan 30 hari
        = 527 ms karena di atas 14 hari perencana berhenti menampung
        agregatnya di memori dan mengurutkan seluruh isi jendela ke disk.

        ## Saringan: `zone_id` melebarkan jendela, `org_id` tidak

        `org_id` dan `zone_id` menyaring **baris mana** yang dihitung.
        Keduanya UUID — panel mencarinya lewat `GET /operator/accounts`
        dan `GET /operator/zones` — bukan teks yang dicocokkan, karena
        pencocokan teks memaksa agregat ini menjoin tabel lain di dalam
        pemindaian partisi.

        Hanya `zone_id` yang menaikkan `maks_hari`, dan sebabnya terukur.
        Satu zona mengubah **bentuk** kuerinya: predikat `zone_id` membuat
        indeks `(zone_id, at DESC)` terpakai, sehingga yang dibaca adalah
        lalu lintas satu pelanggan — persis kueri yang sudah dijalankan
        pemiliknya sendiri setiap hari. Batasnya lalu menjadi **retensi
        paket zona itu** (`sebab_batas: "retensi"`), berlangit-langit 90
        hari, yaitu titik ketika `pangkas_partisi_peristiwa()` sudah
        membuang partisinya.

        `org_id` **tidak** menaikkannya. Yang menentukan biaya bukan
        hadirnya predikat melainkan berapa baris yang tersisa sesudahnya,
        dan sebuah akun dapat memegang bagian mana pun dari lalu lintas
        platform. Diukur pada data yang sama, jendela 30 hari: tanpa
        saringan 628 ms; akun 2 zona 29 ms; akun 8 zona 164 ms (tumpah ke
        disk); akun 24 zona 635 ms — pada baris terakhir perencana kembali
        sendiri ke *Seq Scan* dan biayanya sama persis dengan tanpa
        saringan. Jadi `sebab_batas` tetap `"platform"` dan `maks_hari`
        tetap 14.

        Menyaring per akun **mengikutsertakan domain yang sudah dihapus**:
        peristiwa memang dirancang hidup lebih lama daripada zonanya, dan
        domain yang dihapus kemarin justru yang paling perlu dilihat saat
        menyelidiki. `zona_dalam_akun` menyebut berapa domain yang
        termasuk.

        Permintaan yang menyebut `org_id` atau `zone_id` **dicatat di
        audit** (`operator.waf_filter`), tidak seperti pemuatan tanpa
        saringan. Permintaan bersaringan menanyakan lalu lintas satu
        pelanggan yang disebut namanya, dan "siapa melihat data siapa,
        kapan" adalah pertanyaan pertama ketika penyalahgunaan console
        diselidiki. Yang dicatat hanya identitas yang disaring, bukan
        hasilnya.

        Lantai itu juga menjaga kejujuran grafiknya. `pangkas_operasional()`
        menghapus peristiwa **per zona** menurut retensi paketnya
        masing-masing, jadi jendela yang menoleh lebih jauh daripada
        retensi terpendek akan menurun bukan karena serangan mereda,
        melainkan karena barisnya sudah dibuang.

        `diklem: true` berarti permintaan dipotong. Bila seluruh rentang
        yang diminta jatuh di luar batas, `sejak` dan `sampai` menjadi
        sama dan hasilnya kosong — itu jawaban "di luar jangkauan layar
        ini", bukan "tidak ada serangan".

        ## Nol adalah jawaban, bukan ketiadaan jawaban

        `per_aksi` selalu memuat **keempat** kunci, termasuk yang bernilai
        nol. `per_hari` memuat **setiap** hari UTC di dalam jendela,
        termasuk hari yang sunyi. Ketiga daftar "teratas" selalu berupa
        senarai, kosong bila memang tidak ada apa-apa. Deret berlubang
        terbaca sebagai "tidak ada data"; nol terbaca sebagai "tidak ada
        serangan" — dan hanya yang kedua yang benar untuk hari yang
        tenang.

        `zona` bernilai kosong bila zonanya sudah tidak ada di tabel
        `zones` (peristiwa tidak punya foreign key ke sana dan dapat
        hidup lebih lama daripada zonanya); barisnya tetap dikirim karena
        jumlahnya nyata. `node_id` bernilai `null` untuk peristiwa yang
        tidak mencatat node asalnya.
      parameters:
        - name: sejak
          in: query
          schema: { type: string, format: date-time }
          description: 'RFC3339. Bawaan `now-24h`. Diklem ke `now - maks_hari`.'
        - name: sampai
          in: query
          schema: { type: string, format: date-time }
          description: 'RFC3339. Bawaan `now`; nilai di masa depan diklem ke `now`.'
        - name: org_id
          in: query
          schema: { type: string, format: uuid }
          description: |
            Batasi ke satu akun. Termasuk domain akun itu yang sudah
            dihapus. TIDAK menaikkan `maks_hari` — lihat uraian di atas.
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
          description: |
            Batasi ke satu domain. Menaikkan `maks_hari` menjadi retensi
            paket domain itu (maksimum 90 hari). Bila `org_id` juga
            disebut dan domainnya bukan milik akun itu, permintaan
            ditolak 422 — hasil kosong tidak dapat dibedakan dari domain
            yang tenang.
      responses:
        '200':
          description: Agregat seluruh jendela
          content:
            application/json:
              schema:
                type: object
                required: [jendela, saringan, total, per_aksi, per_hari, aturan_teratas, zona_teratas, node_teratas]
                properties:
                  jendela:
                    type: object
                    description: Rentang yang SESUNGGUHNYA dipakai, bukan yang diminta.
                    required: [sejak, sampai, maks_hari, diklem, sebab_batas]
                    properties:
                      sejak: { type: string, format: date-time }
                      sampai: { type: string, format: date-time }
                      maks_hari: { type: integer, example: 14 }
                      diklem: { type: boolean }
                      sebab_batas:
                        type: string
                        enum: [platform, retensi]
                        description: |
                          Mengapa `maks_hari` sebesar itu. `platform` =
                          dibatasi biaya sapuan seluruh partisi (14).
                          `retensi` = dibatasi retensi paket zona yang
                          disaring.
                  saringan:
                    type: object
                    description: |
                      Saringan yang SESUNGGUHNYA berlaku, digemakan
                      beserta namanya supaya tautan yang membawa UUID
                      tidak perlu dua permintaan lagi untuk dapat
                      menuliskan akun dan domain mana yang sedang dilihat.
                    required: [org_id, akun, zone_id, zona, zona_dalam_akun]
                    properties:
                      org_id: { type: string, format: uuid, nullable: true }
                      akun: { type: string }
                      zone_id: { type: string, format: uuid, nullable: true }
                      zona:
                        type: string
                        description: Tanpa titik akhir FQDN. Kosong bila tidak menyaring domain.
                      zona_dalam_akun:
                        type: integer
                        description: |
                          Berapa domain milik akun yang disaring, termasuk
                          yang sudah dihapus. Nol bila tidak menyaring akun.
                  total: { type: integer, format: int64 }
                  per_aksi:
                    type: object
                    description: Selalu memuat keempat kunci, termasuk yang nol.
                    required: [blokir, tantang, pantau, batasi_laju]
                    properties:
                      blokir: { type: integer, format: int64 }
                      tantang: { type: integer, format: int64 }
                      pantau: { type: integer, format: int64 }
                      batasi_laju: { type: integer, format: int64 }
                  per_hari:
                    type: array
                    description: Satu entri untuk SETIAP hari UTC di jendela, hari sunyi sebagai nol.
                    items:
                      type: object
                      required: [hari, blokir, pantau, batasi_laju, tantang]
                      properties:
                        hari: { type: string, format: date }
                        blokir: { type: integer, format: int64 }
                        pantau: { type: integer, format: int64 }
                        batasi_laju: { type: integer, format: int64 }
                        tantang: { type: integer, format: int64 }
                  aturan_teratas:
                    type: array
                    maxItems: 10
                    description: |
                      Terurut menurun. Dikenali oleh pasangan (sumber, label):
                      kolom `aturan_id` di basis data selalu null, sehingga
                      tidak dikirim sama sekali di layar ini.
                    items:
                      type: object
                      required: [sumber, label, jumlah]
                      properties:
                        sumber: { type: string, enum: [dikelola, pelanggan] }
                        label: { type: string }
                        jumlah: { type: integer, format: int64 }
                  zona_teratas:
                    type: array
                    maxItems: 10
                    description: |
                      Terurut menurun. `blokir` dikirim bersama `jumlah`
                      karena keduanya perlu: 900 peristiwa yang 800 di
                      antaranya diblokir berarti diserang dan tertahan,
                      sedangkan 900 peristiwa yang seluruhnya `pantau`
                      berarti diserang dan LOLOS.
                    items:
                      type: object
                      required: [zone_id, zona, jumlah, blokir]
                      properties:
                        zone_id: { type: string, format: uuid }
                        zona: { type: string, description: 'Kosong bila zonanya sudah tidak ada.' }
                        jumlah: { type: integer, format: int64 }
                        blokir: { type: integer, format: int64 }
                  node_teratas:
                    type: array
                    maxItems: 10
                    description: Terurut menurun.
                    items:
                      type: object
                      required: [node_id, hostname, jumlah]
                      properties:
                        node_id: { type: string, format: uuid, nullable: true }
                        hostname: { type: string }
                        jumlah: { type: integer, format: int64 }
        '422': { $ref: '#/components/responses/Validasi' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/waf-events/rows:
    get:
      tags: [Operator]
      summary: Baris peristiwa WAF satu domain, dilihat operator
      description: |
        Menjawab pertanyaan yang berbeda dari
        `GET /operator/waf-events`: bukan "apa yang terjadi di platform"
        melainkan *apa yang sebenarnya dikirim ke domain ini.*

        ## `zone_id` WAJIB, dan itu batas keamanan bukan optimasi

        Barisnya memuat keterangan tentang **pengunjung situs
        pelanggan**: prefiks alamat, lintasan yang diminta, keluarga
        peramban, nomor Ray. Tidak ada mode "seluruh platform" dan tidak
        ada bawaan: permintaan tanpa `zone_id` ditolak `422`, bukan
        dilayani dengan jendela sempit. Batas jangkauan yang dapat
        dilewati dengan mengosongkan satu parameter bukan batas.

        ## Setiap bacaan yang BERHASIL dicatat

        Berbeda dari agregat — yang hanya dicatat bila membawa saringan —
        setiap jawaban `200` di sini menulis entri audit
        `operator.waf_baris` beserta `zone_id`, nama zona, nama akun,
        jendela, dan berapa baris terkirim. Permintaan yang ditolak
        validasi tidak dicatat: ia tidak memaparkan apa pun, dan jejak
        yang memuatnya membuat jejak yang sesungguhnya lebih sulit
        dibaca.

        Yang dicatat adalah bacaannya, bukan isinya.

        ## Jendela dan klemnya IDENTIK dengan jalur agregat

        `maks_hari` dihitung lewat kode yang sama, yaitu retensi paket
        domain itu (`sebab_batas: "retensi"`), berlangit-langit 90 hari.
        Ini bukan kebetulan implementasi: operator yang melihat agregat
        14 hari lalu membuka barisnya dan menerima 30 hari akan
        menyimpulkan agregatnya salah. Kirim balik `jendela.sejak` dan
        `jendela.sampai` dari jawaban agregat supaya keduanya membaca
        rentang yang sama persis.

        ## Paginasi keyset

        `kursor_berikut` opaque dan terikat pada penyaringnya. Kursor
        yang berasal dari penyaring lain ditolak `422
        WAF_EVENT_CURSOR_INVALID` — sengaja tidak diperlakukan sebagai
        "mulai dari awal", karena halaman pertama yang menyamar sebagai
        halaman berikutnya terlihat seperti daftar yang habis.
      parameters:
        - name: zone_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 'WAJIB. Tanpa ini permintaan ditolak 422.'
        - name: sejak
          in: query
          schema: { type: string, format: date-time }
          description: 'RFC3339. Bawaan `now-24h`. Diklem ke `now - maks_hari`.'
        - name: sampai
          in: query
          schema: { type: string, format: date-time }
          description: 'RFC3339. Bawaan `now`; nilai di masa depan diklem ke `now`.'
        - name: aksi
          in: query
          style: form
          explode: true
          description: |
            Boleh berulang. Nilai yang tidak dikenal DITOLAK, bukan
            diabaikan.
          schema:
            type: array
            items: { type: string, enum: [blokir, tantang, pantau, batasi_laju] }
        - name: ray
          in: query
          schema: { type: string }
          description: 'Nomor yang dibawa pengunjung dari halaman blokir.'
        - name: kursor
          in: query
          schema: { type: string }
          description: 'Opaque, dari `kursor_berikut` respons sebelumnya.'
        - name: batas
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: |
            Baris terbaru lebih dulu, beserta nama zona dan akun yang
            digemakan supaya panel dan entri audit menyebut NAMA, bukan
            hanya UUID.
          content:
            application/json:
              schema:
                type: object
                required: [jendela, zona, akun, peristiwa, kursor_berikut]
                properties:
                  jendela:
                    type: object
                    description: Rentang yang SESUNGGUHNYA dipakai, bukan yang diminta.
                    required: [sejak, sampai, maks_hari, diklem, sebab_batas]
                    properties:
                      sejak: { type: string, format: date-time }
                      sampai: { type: string, format: date-time }
                      maks_hari: { type: integer, example: 30 }
                      diklem: { type: boolean }
                      sebab_batas: { type: string, enum: [platform, retensi] }
                  zona:
                    type: string
                    description: Tanpa titik akhir FQDN.
                  akun:
                    type: string
                    description: Kosong bila zonanya tidak terikat organisasi mana pun.
                  peristiwa:
                    type: array
                    items: { $ref: '#/components/schemas/WafEvent' }
                  kursor_berikut:
                    type: [string, 'null']
                    description: '`null` berarti habis — bukan "coba lagi nanti".'
        '404':
          description: |
            `zone_id` tidak dikenal. Sengaja BUKAN daftar kosong: UUID
            yang salah ketik dan domain yang tenang tidak boleh terlihat
            sama.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Validasi' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/stats:
    get:
      tags: [Operator]
      summary: Angka pertumbuhan untuk dasbor operator
      description: |
        Di-CACHE lima menit di dalam proses. Angka pertumbuhan tidak
        berubah bermakna dalam hitungan detik, sementara query-nya
        memindai tiga tabel menurut tanggal. Tanpa cache, satu dasbor
        yang dibiarkan terbuka di monitor dinding menjalankan pemindaian
        itu setiap kali halaman menyegarkan diri — selamanya.

        Deret 30 hari memakai generate_series sehingga hari TANPA
        pendaftaran tetap muncul sebagai nol. Tanpa itu, grafik
        memampatkan jeda dan pertumbuhan yang BERHENTI terlihat seperti
        pertumbuhan yang lambat.
      responses:
        '200':
          description: Ringkasan dan deret harian
          content:
            application/json:
              schema:
                type: object
                properties:
                  diambil: { type: string, format: date-time }
                  ringkas:
                    type: object
                    additionalProperties: { type: integer }
                  deret:
                    type: array
                    items:
                      type: object
                      properties:
                        tanggal: { type: string, format: date }
                        pengguna: { type: integer }
                        akun: { type: integer }
                        domain: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operator/ns-pool:
    post:
      tags: [Operator]
      summary: Tambah SEPASANG label ke kolam nameserver
      description: |
        Menambahkan DUA label sekaligus, masing-masing menunjuk satu node
        fisik yang BERBEDA.

        Menambah satu-satu tidak dilayani, dan itu disengaja. Sebuah
        domain didelegasikan ke dua nameserver, dan gunanya dua adalah
        agar matinya satu mesin tidak menghentikan domain itu. Label
        tunggal tidak dapat ditugaskan kepada siapa pun; menambahnya satu
        per satu hanya menumpuk label yatim yang tidak seorang pun ingat
        gunanya.

        Kedua node WAJIB berbeda. Pasangan yang kedua labelnya menunjuk
        mesin yang sama menghasilkan delegasi yang TAMPAK redundan padahal
        bergantung pada satu mesin — kegagalan yang tidak terlihat sampai
        mesin itu mati. Ditolak di sini dan oleh indeks unik di database.

        Menerima LABEL saja, tanpa bagian domain. Bagian domainnya datang
        dari konfigurasi saat dijalankan, sehingga kolam yang sama dipakai
        di pengembangan, staging, dan produksi.

        Keduanya SELALU masuk dalam keadaan nonaktif. Dua langkah tangan
        masih tersisa dan keduanya di luar sistem ini: menerbitkan A
        record untuk kedua hostname, dan mendaftarkannya sebagai CHILD
        NAMESERVER di registry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_a, node_a, label_b, node_b]
              properties:
                label_a: { type: string, example: merapi }
                node_a: { type: string, format: uuid }
                label_b: { type: string, example: semeru }
                node_b: { type: string, format: uuid }
      responses:
        '201':
          description: Pasangan ditambahkan, keduanya nonaktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  pasangan: { type: integer }
                  label_a: { type: string }
                  label_b: { type: string }
                  catatan: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/ns-pool/{label}:
    parameters:
      - name: label
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Operator]
      summary: Aktifkan atau nonaktifkan label
      description: |
        MENGAKTIFKAN dibuktikan, bukan dipercaya: sebelum sebuah label
        boleh ditugaskan ke domain pelanggan, `<label>.<domain>` harus
        benar-benar resolve. Pemeriksaannya query DNS sungguhan, bukan
        pembacaan tabel kami sendiri — tabel kami tidak tahu apakah A
        record-nya sudah diterbitkan.

        `paksa: true` melewati pemeriksaan itu. Ia ada karena resolver
        dapat gagal karena sebab di sisi kami, dan operator yang yakin
        harus punya jalan; ia harus disebut sendiri dan tercatat di audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [in_service]
              properties:
                in_service: { type: boolean }
                paksa: { type: boolean, default: false }
      responses:
        '204': { description: Diubah }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Label belum resolve; terbitkan A record-nya lebih dulu }
    delete:
      tags: [Operator]
      summary: Hapus label BESERTA pasangannya dari kolam
      description: |
        MENOLAK bila label masih dipakai domain yang aktif. Domain yang
        terlanjur memakainya harus tetap dapat diverifikasi, dan
        menghapusnya mematikan domain-domain itu tanpa satu pun galat yang
        muncul di sisi pelanggan — delegasinya cocok, tetapi kami tidak
        lagi mengenali namanya.

        Yang benar untuk label yang tidak diinginkan lagi adalah
        MENONAKTIFKANNYA: ia berhenti ditugaskan ke domain baru dan tetap
        sah bagi yang sudah memakainya.
      responses:
        '204': { description: Dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Masih dipakai domain aktif }

  /operator/ns-pool/{label}/check:
    parameters:
      - name: label
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Operator]
      summary: Periksa resolusi label terhadap node fisik
      description: |
        Menanyakan `<label>.<domain>` ke DNS sungguhan dan melaporkan apa
        yang benar-benar terlihat, berdampingan dengan alamat node fisik
        yang seharusnya.

        GET, bukan POST: memeriksa tidak mengubah apa pun, dan operator
        harus dapat memeriksa berulang kali tanpa khawatir menyentuh
        keadaan.
      responses:
        '200':
          description: Hasil pemeriksaan
          content:
            application/json:
              schema:
                type: object
                properties:
                  fqdn: { type: string }
                  terlihat: { type: array, items: { type: string } }
                  kurang:
                    type: array
                    items: { type: string }
                    description: Alamat node aktif yang TIDAK muncul di DNS.
                  asing:
                    type: array
                    items: { type: string }
                    description: Alamat yang muncul di DNS tetapi bukan node kami.
                  cocok: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Resolver tidak dipasang pada instance ini }

  /operator/reconcile:
    post:
      tags: [Operator]
      summary: Bandingkan database dengan data plane
      description: |
        Bawaannya LAPORAN saja. `?perbaiki=true` mengantrikan rebuild untuk
        zona yang berselisih — lewat antrian yang sama dengan perubahan
        biasa, dan tercatat di audit.
      parameters:
        - { name: perbaiki, in: query, schema: { type: boolean } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  diperiksa: { type: integer }
                  drift: { type: integer }
                  diperbaiki: { type: integer }
                  gagal: { type: integer }
                  zona:
                    type: array
                    items:
                      type: object
                      properties:
                        zone: { type: string }
                        ringkasan: { type: string }
                        hilang_di_data_plane: { type: array, items: { type: string } }
                        asing_di_data_plane: { type: array, items: { type: string } }
                        isinya_berbeda: { type: array, items: { type: string } }
        '403': { description: Bukan operator, 2FA belum aktif/terverifikasi, atau memakai token API }
        '503': { description: Rekonsiliasi tidak dapat dijalankan }

  /operator/jobs/dlq:
    get:
      tags: [Operator]
      summary: Job yang sudah menyerah, beserta zonanya
      description: |
        `/operator/health` hanya memulangkan JUMLAH job DLQ. Rute ini
        memulangkan identitasnya: zona mana, jenis job apa, dan sebab
        terakhirnya.

        `stale` menandai job yang sudah TERCAKUP publikasi versi yang
        lebih baru — zonanya tidak benar-benar tertinggal, dan worker akan
        membuangnya saat diklaim. Hanya berlaku untuk `publish` dan
        `rebuild`; `suspend` dan `dnssec_*` tidak pernah basi karena
        keduanya tidak menaikkan versi zona.

        Daftarnya dibatasi 200 baris; `total` menyebut jumlah sebenarnya.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  batas: { type: integer }
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        zone_id: { type: string, format: uuid }
                        zone: { type: string }
                        kind:
                          type: string
                          enum: [publish, rebuild, delete, suspend, dnssec_enable, dnssec_disable]
                        zone_version: { type: integer, format: int64 }
                        zone_version_now: { type: integer, format: int64 }
                        attempts: { type: integer }
                        last_error: { type: string }
                        stale: { type: boolean }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        '403': { description: Bukan operator, 2FA belum aktif/terverifikasi, atau memakai token API }
        '503': { description: Antrian tidak dapat dibaca }

  /operator/jobs/dlq/retry:
    post:
      tags: [Operator]
      summary: Kembalikan job DLQ ke antrian
      description: |
        Menyetel ulang status, percobaan, dan jadwal. TIDAK menerbitkan
        apa pun sendiri — penerbitannya tetap lewat `syncd`, jalur yang
        sama dengan job biasa.

        `ids` kosong berarti SEMUA job DLQ. Perbaiki dulu sebab di
        `last_error`; mengulang tanpa itu hanya memindahkan sepuluh
        kegagalan yang sama ke tiga belas menit berikutnya.

        Tercatat di audit sebagai `operator.dlq_retry`, dengan jumlah yang
        BENAR-BENAR berubah.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: integer, format: int64 }
                  description: Kosongkan untuk mengulang seluruh job DLQ.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  diulang: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/Validasi' }
        '403': { description: Bukan operator, 2FA belum aktif/terverifikasi, atau memakai token API }
        '503': { description: Job tidak dapat diulang }

  /status:
    get:
      tags: [Operator]
      summary: Status page publik
      description: |
        Tanpa autentikasi dengan sengaja (NFR-O3): yang paling
        membutuhkannya adalah orang yang sedang tidak dapat masuk.
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [operasional, terganggu, gangguan] }
                  summary: { type: string }
                  checked_at: { type: string, format: date-time }
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        state: { type: string }
                        detail: { type: string }

  /operator/health:
    get:
      tags: [Operator]
      summary: Dasbor kesehatan platform
      description: |
        Hanya untuk operator platform: memerlukan akun operator dan sesi yang
        sudah lolos 2FA. Token API **selalu** ditolak — kewenangan lintas
        organisasi tidak boleh dipakai kredensial yang bisa tertinggal di
        berkas konfigurasi.

        Kunci yang query-nya gagal DIHILANGKAN dari respons, bukan diisi
        nol. Klien wajib membedakan "tidak diketahui" dari "tidak ada":
        mengubah yang pertama menjadi angka nol menyembunyikan justru
        keadaan yang paling perlu dilihat — mis. jumlah zona dengan DS
        tidak cocok.
      responses:
        '200':
          description: Ringkasan zona, antrian, DNSSEC, nameserver
          content:
            application/json:
              schema:
                type: object
                properties:
                  zona: { type: object, additionalProperties: { type: integer } }
                  antrian: { type: object, additionalProperties: { type: integer } }
                  dnssec:
                    type: object
                    description: Dihilangkan seluruhnya bila query-nya gagal.
                    additionalProperties: { type: integer }
                  nameserver: { type: array, items: { type: object } }
                  rrsig_tersisa_jam: { type: number, nullable: true }
                  pending_terlama: { type: string, format: date-time, nullable: true }
                  job_dlq: { type: integer }
        '403': { description: Bukan operator, 2FA belum aktif/terverifikasi, atau memakai token API }

  /operator/zones:
    get:
      tags: [Operator]
      summary: Cari zona lintas organisasi
      description: |
        Halaman PERTAMA setiap pencarian tercatat di audit sebagai aksi
        operator (FR-7.7). Menelusuri halaman berikutnya tidak dicatat
        ulang: itu pencarian yang sama, dan mencatatnya berulang mengubah
        audit menjadi kebisingan yang menyembunyikan pencarian yang
        benar-benar berbeda.

        `total` dikembalikan supaya paginasi dapat menyebut BERAPA BANYAK
        yang ada, bukan hanya apakah ada halaman berikutnya. Operator
        yang menelusuri laporan penyalahgunaan perlu tahu apakah ia
        melihat 3 hasil atau 3 dari 4.000.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - name: status
          in: query
          description: |
            Disaring di DATABASE, bukan di klien. Nilai yang tidak
            dikenal diabaikan, bukan ditolak — filter yang salah ketik
            sebaiknya menampilkan semuanya daripada menampilkan galat.
          schema:
            type: string
            enum: [pending_verification, active, moved, inactive, suspended_moved, suspended_abuse, cancelled]
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: Daftar zona beserta organisasinya
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        name_unicode: { type: string }
                        status: { type: string }
                        dnssec_enabled: { type: boolean }
                        plan:
                          type: string
                          description: |
                            Paket EFEKTIF — kedaluwarsa sudah
                            diperhitungkan. Membaca plan_id apa adanya
                            akan menampilkan paket berbayar pada domain
                            yang paketnya habis kemarin, dan operator
                            yang menagih berdasarkan layar ini menagih
                            yang salah.
                        plan_default: { type: boolean }
                        plan_expires_at: { type: string, format: date-time, nullable: true }
                        butuh_klaim: { type: boolean }
        butuh_klaim:
          type: boolean
          description: |
            true = delegasi yang cocok TIDAK cukup mengaktifkan zona ini.
            Namanya pernah dikelola organisasi lain dengan pasangan
            nameserver yang sama, atau pernah ditangguhkan karena
            penyalahgunaan. Diselesaikan lewat POST /zone-claims.
                        created_at: { type: string, format: date-time }
                        org:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            owner_email: { type: string }
        '403': { description: Bukan operator, 2FA belum aktif/terverifikasi, atau memakai token API }

  /operator/zones/{id}/suspend:
    post:
      tags: [Operator]
      summary: Tangguhkan zona (abuse)
      description: |
        Zona dicabut dari data plane — bukan diarahkan ke halaman sinkhole.
        Pilihan ini netral dan tidak menempatkan kami sebagai penyaji konten
        atas nama domain orang lain. Alasan **wajib** dan tercatat di audit
        sebagai aksi operator. Pemilik diberi tahu beserta jalur bandingnya.

        Yang dicabut hanyalah keanggotaan katalog, sehingga slave membuang
        zona. Zona beserta **kunci DNSSEC-nya tetap utuh** di hidden
        primary, dan pemulihan mengembalikan keadaan yang persis sama.

        Bedanya menentukan: menghapus zona di engine ikut memusnahkan
        cryptokeys-nya, dan pemulihan lalu menerbitkan zona TANPA tanda
        tangan sementara registrar masih mengumumkan DS — SERVFAIL bagi
        setiap resolver yang memvalidasi.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                report_reference: { type: string }
      responses: { '204': { description: Ditangguhkan } }

  /operator/zones/{id}/unsuspend:
    post:
      tags: [Operator]
      summary: Cabut penangguhan
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { '204': { description: Dipulihkan } }

  /operator/orgs/{id}/quota:
    patch:
      tags: [Operator]
      summary: Ubah kuota organisasi
      description: |
        Batas record per zona di atas 10.000 ditolak: ia menentukan biaya
        AXFR penuh yang dikirim ke setiap slave pada SETIAP perubahan
        (ADR-001), sehingga menaikkannya memerlukan peninjauan teknis.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                max_records_per_zone: { type: integer, maximum: 10000 }
                reason: { type: string }
      responses: { '204': { description: Kuota diubah } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token API berawalan `dcid_`.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dnscloud_session

  parameters:
    Zone:
      name: zone
      in: path
      required: true
      schema: { type: string }
      description: Nama zona (`contoh.id`) atau UUID-nya.

  responses:
    Validasi:
      description: Data tidak valid
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Autentikasi diperlukan
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Tidak ditemukan
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    # Ketiga di bawah ini sudah dirujuk 41 kali di seluruh berkas tanpa
    # pernah didefinisikan — $ref menggantung yang membuat generator
    # klien gagal total, bukan hanya melewatinya. `ValidationError`
    # adalah nama lain untuk `Validasi` yang terlanjur dipakai; keduanya
    # dipertahankan alih-alih disatukan, karena mengganti nama di 9
    # tempat menambah perubahan yang tidak ada hubungannya dengan
    # perbaikan ini.
    Forbidden:
      description: Tidak diizinkan
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Data tidak valid
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Bertentangan dengan keadaan saat ini
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    KataKunciWAF:
      type: object
      required: [id, paket, tingkat, kata, aktif, catatan, dipakai]
      properties:
        id:      { type: string, format: uuid }
        paket:   { type: string, example: disusupi }
        tingkat:
          type: string
          enum: [blokir, akar, tandai]
        kata:
          type: string
          pattern: '^[a-z0-9]([a-z0-9_-]{0,62}[a-z0-9])?$'
          example: slot-gacor
        aktif:   { type: boolean }
        catatan:
          type: string
          description: Mengapa kata ini ada — dibaca setahun kemudian.
        dipakai:
          type: integer
          description: |
            Berapa paket berlangganan yang menyalakan paket aturan ini.
            Nol berarti kosakata ini tidak sedang memeriksa satu
            permintaan pun.
    AksesKebijakan:
      type: object
      required: [id, nama, jalur, mode, aktif, sesi_menit, epoch, catatan, ip, email, updated_at]
      properties:
        id:    { type: string, format: uuid }
        nama:  { type: string, description: 'Relatif terhadap apex.' }
        jalur: { type: string, description: 'Awalan. Yang terpanjang menang.' }
        mode:
          type: string
          enum: [wajib, pintas]
          description: |
            `wajib` = IP dan identitas keduanya harus lolos.
            `pintas` = alamat di daftar lolos tanpa identitas.
        aktif:      { type: boolean }
        sesi_menit: { type: integer }
        epoch:
          type: integer
          description: |
            Penanda pencabutan. Naik setiap kali SIAPA yang boleh
            berubah; token yang epoch-nya lebih tua ditolak node.
        catatan: { type: string }
        ip:
          type: array
          items:
            type: object
            required: [id, cidr, catatan]
            properties:
              id:      { type: string, format: uuid }
              cidr:    { type: string }
              catatan: { type: string }
        email:
          type: array
          items:
            type: object
            required: [id, pola, catatan]
            properties:
              id:      { type: string, format: uuid }
              pola:    { type: string, description: '`orang@contoh.id` atau `@contoh.id`.' }
              catatan: { type: string }
        updated_at: { type: string, format: date-time }
    AksesIdentitas:
      type: object
      required: [id, email, terakhir_masuk_at, created_at]
      properties:
        id:    { type: string, format: uuid }
        email: { type: string, format: email }
        terakhir_masuk_at: { type: [string, 'null'], format: date-time }
        created_at:        { type: string, format: date-time }
    Parkir:
      type: object
      required: [aktif, judul, pesan, taut_url, taut_teks, diparkir, nama_diparkir]
      properties:
        aktif:
          type: boolean
          description: |
            IZIN, bukan keadaan. false = nama tanpa server asal menjawab
            `DC_1006` alih-alih halaman parkir.
        judul:
          type: string
          description: Kosong = kalimat bawaan node tepi.
        pesan:
          type: string
          description: Kosong = kalimat bawaan node tepi.
        taut_url:  { type: string, description: 'http/https saja. Berpasangan dengan taut_teks.' }
        taut_teks: { type: string }
        diparkir:
          type: boolean
          description: |
            KEADAAN: apakah halaman parkir benar-benar sedang tayang.
            false pada domain yang sudah diberi server asal, meski
            `aktif` tetap true.
        nama_diparkir:
          type: array
          items: { type: string }
          description: |
            Nama relatif yang sedang menayangkannya (`@`, `www`).
            Menyusut sendiri saat pemilik mengarahkan nama ke asalnya.
    WafEvents:
      type: object
      required: [jendela, ringkasan, peristiwa, kursor_berikut]
      properties:
        jendela:
          type: object
          description: |
            Rentang yang SESUNGGUHNYA dipakai. Ia dikembalikan supaya
            pemotongan retensi dapat dibaca — jendela yang dipotong
            diam-diam tampil persis seperti jendela yang memang kosong.
          required: [sejak, sampai, retensi_hari, diklem]
          properties:
            sejak: { type: string, format: date-time }
            sampai: { type: string, format: date-time }
            retensi_hari:
              type: integer
              description: |
                Berapa hari ke belakang paket domain ini menyimpan
                peristiwa. Batas keras platform 90 hari.
            diklem:
              type: boolean
              description: 'true bila permintaan melebihi retensi paket dan dipotong.'
        ringkasan:
          description: '`null` pada permintaan yang membawa `kursor`.'
          oneOf:
            - $ref: '#/components/schemas/WafEventsRingkasan'
            - type: 'null'
        peristiwa:
          type: array
          items: { $ref: '#/components/schemas/WafEvent' }
        kursor_berikut:
          type: [string, 'null']
          description: '`null` berarti habis — bukan "coba lagi nanti".'
    WafEventsRingkasan:
      type: object
      description: Agregat SELURUH jendela, bukan halaman ini saja.
      required: [total, per_aksi, per_hari, aturan_teratas]
      properties:
        total: { type: integer }
        per_aksi:
          type: object
          description: |
            Selalu memuat keempat kunci, termasuk yang bernilai nol. Kunci
            yang hilang dirender sebagai ruang kosong; nol dirender
            sebagai nol, dan keduanya pernyataan yang berbeda.
          required: [blokir, pantau, batasi_laju, tantang]
          properties:
            blokir: { type: integer }
            pantau: { type: integer }
            batasi_laju: { type: integer }
            tantang: { type: integer }
        per_hari:
          type: array
          description: |
            Satu entri untuk SETIAP hari UTC di dalam jendela, termasuk
            hari yang nol. Deret berlubang dibaca sebagai "tidak ada
            data"; nol dibaca sebagai "tidak ada serangan".
          items:
            type: object
            required: [hari, blokir, pantau, batasi_laju, tantang]
            properties:
              hari: { type: string, format: date }
              blokir: { type: integer }
              pantau: { type: integer }
              batasi_laju: { type: integer }
              tantang: { type: integer }
        aturan_teratas:
          type: array
          maxItems: 10
          items:
            type: object
            required: [aturan_id, sumber, label, jumlah]
            properties:
              aturan_id: { type: [string, 'null'], format: uuid }
              sumber: { type: string, enum: [dikelola, pelanggan] }
              label: { type: string }
              jumlah: { type: integer }
    WafEvent:
      type: object
      description: |
        Satu permintaan yang TIDAK diloloskan. Yang tidak ada di sini
        juga tidak ada di penyimpanan, dan ketiadaannya adalah
        kebijakannya: alamat utuh, query string, kuki, header
        Authorization, badan permintaan, User-Agent utuh, referrer.
      required:
        [at, hostname, aksi, aturan_id, aturan_sumber, aturan_label,
         skor_anomali, metode, jalur, kueri_kunci, kode_status,
         ip_prefix, negara, asn, ua_keluarga, ray]
      properties:
        at: { type: string, format: date-time }
        hostname: { type: string }
        aksi:
          type: string
          enum: [blokir, tantang, pantau, batasi_laju]
          description: |
            `lolos` tidak pernah muncul, karena baris seperti itu tidak
            pernah ditulis.
        aturan_id:
          type: [string, 'null']
          format: uuid
          description: |
            UUID, bukan nomor aturan CRS — itulah tipe kolomnya. Jalur
            penerimaan laporan node belum pernah menuliskannya, jadi
            hari ini nilainya selalu `null`; yang benar-benar mengenali
            sebuah aturan adalah pasangan (`aturan_sumber`,
            `aturan_label`), dan itu pula kunci pengelompokan
            `aturan_teratas`.
        aturan_sumber: { type: string, enum: [dikelola, pelanggan] }
        aturan_label: { type: string }
        skor_anomali: { type: integer }
        metode: { type: string }
        jalur:
          type: string
          description: |
            Lintasan saja, dipotong 256 byte, TANPA query string. Query
            string membawa token sesi, tautan reset password, dan alamat
            surel; yang tersimpan hanya NAMA parameternya.
        kueri_kunci:
          type: array
          items: { type: string }
          description: 'Nama parameter query, tanpa satu pun nilainya.'
        kode_status: { type: integer }
        ip_prefix:
          type: string
          description: |
            Prefiks, bukan alamat: /24 untuk IPv4, /48 untuk IPv6. Cukup
            mengenali satu penyerang; tidak cukup mengenali satu rumah
            tangga.
        negara:
          type: string
          description: 'Kosong selama node belum melaporkannya.'
        asn:
          type: integer
          description: '0 selama node belum melaporkannya.'
        ua_keluarga:
          type: string
          description: |
            Keluarga hasil penguraian, bukan senar User-Agent. Hash
            berkuncinya sengaja tidak ikut dikirim.
        ray:
          type: string
          description: |
            Nomor yang diberikan kepada pengunjung di halaman blokir.
            Inilah yang membuat positif palsu dapat diperbaiki tanpa
            menyimpan lebih banyak data tentang semua orang.
    WafRuleInput:
      type: object
      required: [nama, kondisi, aksi]
      properties:
        hostname:
          type: string
          description: |
            Kosong berarti berlaku untuk SELURUH nama yang diproksikan di
            domain ini.
        nama:
          type: string
          maxLength: 100
          description: |
            Nama inilah yang muncul di daftar peristiwa saat aturannya
            menyala.
        urutan:
          type: integer
          default: 0
          description: |
            Menentukan aturan mana yang dievaluasi lebih dulu. Yang pertama
            cocok yang memutuskan, jadi urutan yang terlihat di panel adalah
            urutan yang benar-benar dijalankan.
        kondisi:
          type: object
          required: [semua]
          properties:
            semua:
              type: array
              maxItems: 16
              items:
                type: object
                required: [bidang, op, nilai]
                properties:
                  bidang:
                    type: string
                    enum: [jalur, kueri, metode, ip, user_agent, host, header, kuki]
                  kunci:
                    type: string
                    description: Nama header atau kuki. Wajib untuk kedua bidang itu.
                  op:
                    type: string
                    enum: [sama, bukan, awali, akhiri, memuat, cocok, dalam_cidr]
                    description: |
                      `cocok` adalah ekspresi reguler yang tidak peka huruf
                      besar-kecil dan tidak dijangkar. `dalam_cidr` hanya
                      berlaku untuk bidang `ip`, dan menerima alamat tunggal
                      maupun rentang.
                  nilai:
                    type: array
                    maxItems: 32
                    items: { type: string, maxLength: 512 }
        aksi:
          type: string
          enum: [blokir, izinkan, catat, batasi_laju]
          description: |
            `izinkan` melewati SELURUH pemeriksaan sisanya — WAF dan batas
            laju. Ia satu-satunya jalan melewati WAF yang dimiliki
            pelanggan, dan sengaja berbentuk aturan bernama yang terlihat
            di panel dan tercatat di audit.

            `catat` mencatat lalu meneruskan — jalan untuk menguji sebuah
            aturan sebelum memblokirkannya.
        laju_per_menit:
          type: integer
          minimum: 1
          description: Wajib untuk aksi `batasi_laju`. Dihitung per aturan per alamat pengunjung.
        aktif: { type: boolean, default: true }
    PaketInput:
      type: object
      required: [nama, max_records, max_perubahan_harian, api_baca_per_menit, api_tulis_per_menit]
      properties:
        kode: { type: string, description: hanya saat membuat }
        nama: { type: string }
        max_records: { type: integer, minimum: 1, maximum: 10000 }
        max_perubahan_harian: { type: integer, minimum: 1 }
        api_baca_per_menit: { type: integer, minimum: 1 }
        api_tulis_per_menit: { type: integer, minimum: 1 }
        jeda_publikasi_detik:
          type: integer
          minimum: 0
          maximum: 300
          description: |
            Berapa detik menunggu perubahan berikutnya sebelum
            menerbitkan. Setiap perubahan baru menggeser jadwalnya,
            sehingga suntingan beruntun digabung menjadi SATU publikasi —
            dan satu publikasi berarti satu penandatanganan ulang DNSSEC
            plus dua transfer penuh, biaya yang sama besar untuk satu
            record maupun lima ratus.

            Nol berarti terbit seketika. Kuota perubahan harian TIDAK
            ikut digabung: ia tetap menghitung setiap penyimpanan.
        urutan: { type: integer }

        # ── Load balancer ──
        #
        # `load_balancer` adalah SAKELARNYA; angka di bawahnya hanya
        # berlaku saat ia menyala. Dimatikan, `max_load_balancer`
        # dipaksa nol — dan nol itulah yang benar-benar menahan fitur di
        # seluruh jalur lain, sehingga tidak ada keadaan "centang mati
        # tetapi batas masih tiga".
        load_balancer: { type: boolean, default: false }
        max_load_balancer: { type: integer, minimum: 0 }
        max_origin_per_lb:
          type: integer
          minimum: 0
          description: |
            Dipaksa minimum 2 saat load balancer menyala: load balancer
            dengan satu node bukan load balancer, ia record biasa yang
            lebih rumit.
        cek_interval_min_detik:
          type: integer
          description: |
            Interval pemeriksaan TERCEPAT yang boleh dipilih pelanggan —
            lantainya, bukan yang dipakai. Ia membatasi lalu lintas
            keluar yang kami kirim atas nama pelanggan ke server orang
            lain. Di bawah 5 dipaksa menjadi 30.
        min_ttl_detik:
          type: integer
          description: |
            TTL terendah yang boleh DISIMPAN pelanggan. Batas KOMERSIAL,
            berbeda dari batas teknis 60 detik yang berlaku untuk semua
            orang. Nol berarti hanya batas teknis yang tersisa.

        # ── Proxy tepi & WAF ──
        #
        # `proksi` adalah SAKELARNYA, pola yang sama dengan
        # `load_balancer`. Dimatikan, `max_hostname_proksi` dipaksa nol.
        #
        # Tanpa field-field ini, kelima kolom hanya dapat disetel lewat
        # psql — dan itu berarti operator menjual paket berbayar yang
        # proxy-nya MATI tanpa satu pun cara menyalakannya dari console.
        # Keadaan itu benar-benar terjadi: migrasi 0039 hanya mengisi
        # paket bawaan, sehingga setiap paket berbayar lahir dengan nol
        # pada kelimanya.
        proksi: { type: boolean, default: false }
        max_hostname_proksi:
          type: integer
          minimum: 0
          description: |
            Jumlah nama yang boleh diproksikan. Membatasi ukuran indeks
            per node DAN jumlah SERTIFIKAT — sumber daya paling langka
            di sini, karena jatahnya ditetapkan Let's Encrypt, dibagi
            dengan seluruh akun ACME di dunia, dan tidak dapat dibeli.
            0 = fitur mati.
        max_aturan_waf:
          type: integer
          minimum: 0
          description: |
            Aturan WAF tulisan pelanggan. Membatasi CPU per permintaan,
            dan satu-satunya batas di sini yang dibayar setiap pengunjung
            pelanggan dalam bentuk latensi. 0 = pelanggan tidak dapat
            menulis satu pun, meski mode WAF tetap dapat diatur.
        max_byte_badan_kb:
          type: integer
          minimum: 0
          maximum: 10240
          description: |
            Ukuran badan permintaan yang masih DIPERIKSA WAF. Membatasi
            MEMORI per permintaan yang sedang berjalan: seribu unggahan
            bersamaan pada batas 10 MB adalah 10 GB di satu node. Nol
            dipaksa menjadi 1024 saat proxy menyala.
        retensi_peristiwa_hari:
          type: integer
          minimum: 0
          maximum: 90
          description: |
            Berapa lama peristiwa keamanan disimpan PER BARIS. Batas 90
            hari berlaku untuk paket mana pun, termasuk yang belum ada:
            ia janji tentang berapa lama kami memegang data yang
            menyangkut orang (NFR-C1), bukan angka yang dapat dijual.
            0 = peristiwa hanya DIHITUNG, tidak disimpan.
        maks_paranoia:
          type: integer
          minimum: 1
          maximum: 4
          description: |
            Tingkat paranoia OWASP CRS tertinggi yang boleh dipilih
            pelanggan. Lebih tinggi mengevaluasi lebih banyak aturan DAN
            memblokir lebih banyak pelanggan yang tidak melakukan
            kesalahan apa pun — biayanya jatuh pada dukungan.
        paket_waf:
          type: array
          items: { type: string }
          description: |
            Paket aturan WAF terkelola yang boleh DINYALAKAN pada paket
            ini. Kosong berarti tidak ada.
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Ditulis untuk dibaca manusia; boleh berubah. }
        code: { type: string, description: '**Stabil** — bagian kontrak publik, aman dijadikan dasar logika program.' }
        instance: { type: string, description: ID permintaan; sertakan saat menghubungi dukungan. }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    ZoneStatus:
      type: string
      enum: [pending_verification, active, moved, suspended_moved, suspended_abuse, cancelled, deleted]

    Zone:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Punycode, lowercase, diakhiri titik. }
        name_unicode: { type: string, description: Bentuk untuk ditampilkan. }
        status: { $ref: '#/components/schemas/ZoneStatus' }
        version: { type: integer, description: Naik satu setiap changeset. }
        soa_serial: { type: integer }
        dnssec_enabled: { type: boolean }
        butuh_klaim:
          type: boolean
          description: |
            true = delegasi yang cocok TIDAK cukup mengaktifkan zona ini.
            Namanya pernah dikelola organisasi lain dengan pasangan
            nameserver yang sama, atau pernah ditangguhkan karena
            penyalahgunaan. Diselesaikan lewat POST /zone-claims.
        rrset_count:
          type: integer
          description: Jumlah RRset zona, termasuk NS apex yang dikelola sistem.
        activated_at: { type: [string, 'null'], format: date-time }
        moved_since:
          type: [string, 'null']
          format: date-time
          description: Sejak kapan NS registrar tidak lagi menunjuk ke pasangan organisasi.
        grace_ends_at:
          type: [string, 'null']
          format: date-time
          description: |
            Batas masa tenggang zona berstatus `moved`, dihitung server.

            Dikirim sebagai tanggal, bukan sebagai sisa hari: klien yang
            menghitung sendiri harus menyalin kebijakan 14 hari, dan
            salinan itu meleset begitu kebijakannya berubah.
        created_at: { type: string, format: date-time }
        plan_name:
          type: string
          description: |
            Nama paket yang BERLAKU untuk domain ini sekarang.

            Paket melekat pada domain, bukan pada akun, jadi satu daftar
            wajar memuat domain berbayar dan gratis berdampingan.

            Masa berlaku sudah diperhitungkan server: paket berbayar yang
            sudah lewat dilaporkan sebagai paket bawaan — sama persis
            dengan yang diberlakukan gerbang kuota. Klien tidak perlu,
            dan tidak boleh, menghitungnya sendiri.
        plan_default:
          type: boolean
          description: true bila paket yang berlaku adalah paket bawaan (gratis).
        plan_expires_at:
          type: [string, 'null']
          format: date-time
          description: |
            Kapan paket berbayar domain ini berakhir.

            Tetap dikirim SETELAH lewat, dan itu disengaja: berakhirnya
            paket menurunkan batas record dan batas perubahan harian
            tanpa satu pun tindakan pemiliknya. Tanpa tanggal ini, yang
            tersisa hanyalah domain yang tiba-tiba menolak perubahan
            tanpa sebab yang dapat dibaca.

            Record yang sudah ada TIDAK dihapus saat paket berakhir; yang
            turun hanya batasnya.

    HasilImport:
      type: object
      properties:
        zone: { type: string }
        accepted: { type: integer }
        skipped: { type: integer }
        dry_run:
          type: boolean
          description: Bila true, tidak ada satu pun perubahan yang ditulis.
        rrsets:
          type: array
          description: RRset yang akan dibuat (atau sudah dibuat bila commit).
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              ttl: { type: integer }
              records: { type: array, items: { type: object } }
        warnings: { type: array, items: { type: string } }
        skipped_records:
          type: array
          description: |
            Record yang DILEWATI beserta alasannya. Bagian terpenting dari
            hasil impor: migrasi yang diam-diam kehilangan record jauh lebih
            berbahaya daripada migrasi yang gagal terang-terangan.
          items:
            type: object
            properties:
              line:
                type: string
                description: Baris sumber, diringkas.
              reason:
                type: string
                description: |
                  Kalimat penjelas, dalam Bahasa Indonesia. Ditujukan untuk
                  ditampilkan apa adanya, BUKAN untuk diklasifikasi klien —
                  pakai `category` untuk itu.
              category:
                type: string
                enum: [platform, unsupported, invalid]
                description: |
                  Kode kategori. Tiga keadaan ini sangat berbeda artinya bagi
                  pengguna dan harus dibedakan di layar:

                  - `platform` — dilewati karena platform yang mengelolanya
                    (SOA, NS apex, record DNSSEC). **Tidak ada** record
                    pengguna yang hilang.
                  - `unsupported` — tipe atau bentuknya belum dapat kami
                    simpan. Record **nyata hilang**; ini yang paling perlu
                    dilihat pengguna.
                  - `invalid` — record ditolak validasi.

                  Klien TIDAK BOLEH menyimpulkan kategori dengan mencocokkan
                  substring pada `reason`: klasifikasi seperti itu rusak
                  diam-diam pada perubahan kata sekecil apa pun, dan saat ia
                  rusak, SOA dan NS apex ikut tampil sebagai kehilangan.

    RRset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'Relatif terhadap apex; `@` untuk apex.' }
        type: { type: string }
        ttl: { type: integer }
        records: { type: array, items: { type: object } }
        comment: { type: string }
        system_managed: { type: boolean, description: SOA & NS apex terkunci dari pengguna. }
        updated_at: { type: string, format: date-time }

    NSStatus:
      type: object
      properties:
        hostname: { type: string }
        serial: { type: integer }
        healthy: { type: boolean }
        error: { type: string }
        observed_at: { type: string, format: date-time }

    DnssecStatus:
      type: object
      properties:
        enabled: { type: boolean }
        chain_state: { type: string, enum: [nonaktif, menunggu_ds, aman, mismatch, error] }
        chain_label: { type: string }
        detail: { type: string }
        ds: { type: array, items: { type: string }, description: Siap salin ke panel registrar. }
        dnskey: { type: string }
        key_tag: { type: integer }
        algorithm: { type: integer }
        checked_at: { type: string, format: date-time }
        rrsig_expires_at: { type: string, format: date-time }
        provisioning:
          type: boolean
          description: |
            true = pengaktifan sudah diterima dan sedang dikerjakan
            worker, meski `enabled` masih false.

            POST /zones/{zone}/dnssec menjawab 202: pembuatan kunci dan
            penandatanganan zona berjalan asinkron. Selama jeda itu
            `enabled` masih false, dan tanpa bidang ini klien tidak punya
            cara membedakan "belum pernah diaktifkan" dari "baru saja
            diaktifkan". Pantau bidang ini alih-alih menyimpan penanda
            sendiri — ia tetap benar setelah halaman ditutup dan dibuka
            lagi dari perangkat lain.
        next_check_at:
          type: string
          format: date-time
          description: |
            Kapan pemeriksaan rantai berikutnya dijadwalkan.

            Iramanya mengikuti keadaan, bukan satu interval datar: 15 menit
            selama masih ada yang ditunggu (`menunggu_ds`, `mismatch`,
            atau belum pernah diperiksa), melebar dengan backoff sampai 6
            jam, dan 6 jam bagi rantai yang sudah `aman`. Backoff dinolkan
            setiap kali `chain_state` berubah.

            POST /zones/{zone}/dnssec/check menggesernya ke sekarang.
        provision_failed:
          type: boolean
          description: |
            true = pengaktifan dicoba berulang kali dan menyerah.

            Zona tidak berubah dan tetap dijawab seperti biasa; yang
            belum ada hanyalah tanda tangannya. `detail` berisi pesan
            terakhir dari worker. Kirim ulang POST untuk mencoba lagi.

    Warning:
      type: object
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning] }
        name: { type: string }
        type: { type: string }
        message: { type: string }

    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        org_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        totp_enabled: { type: boolean }
        is_operator: { type: boolean }
        has_password: { type: boolean }
        # Panel memakainya untuk mengingatkan pengguna yang belum
        # menyelesaikan verifikasi, tanpa perlu endpoint kedua.
        email_verified: { type: boolean }
